name: Apply stable InfusionCalc 0.1.4 release

on:
  push:
    branches:
      - release/0.1.4-seo
    paths:
      - '.github/workflows/apply-stable-0.1.4.yml'

permissions:
  contents: write

concurrency:
  group: apply-stable-infusioncalc-0.1.4
  cancel-in-progress: false

jobs:
  apply:
    name: Patch, validate and commit stable release sources
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out release branch
        uses: actions/checkout@v6

      - name: Repair inherited beta audit defects
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tool/audit_production_routes.py')
          source = path.read_text(encoding='utf-8')

          replacements = (
              (
                  '"n            f"found status {result.status}.",',
                  '"\n            f"found status {result.status}.",',
              ),
              (
                  'self.body_status: str | None = None',
                  'self.body_page: str | None = None',
              ),
              (
                  'self.body_status = values.get("data-http-status")',
                  'self.body_page = values.get("data-page")',
              ),
              (
                  'if parser.body_status != "404":\n'
                  '        raise AuditError("The 404 page must expose data-http-status=\\"404\\".")',
                  'if parser.body_page != "not-found":\n'
                  '        raise AuditError("The 404 page must expose data-page=\\"not-found\\".")',
              ),
          )
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(
                      f'Expected inherited audit fragment exactly once: {old!r}',
                  )
              source = source.replace(old, new, 1)

          path.write_text(source, encoding='utf-8')
          PY

      - name: Apply reviewed stable release patch
        run: python3 tool/apply_release_0_1_4.py

      - name: Normalize generated release documentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          roadmap_path = Path('ROADMAP.md')
          roadmap = roadmap_path.read_text(encoding='utf-8')
          old_roadmap = (
              '**Zgłoszenie:** [issue #46]'
              '(https://github.com/8s4nfddmv9-lab/kalkulator-lekow/issues/46).  \n'
              '**Informacje o wydaniu:**'
          )
          new_roadmap = (
              '**Zgłoszenie:** [issue #46]'
              '(https://github.com/8s4nfddmv9-lab/kalkulator-lekow/issues/46).\n\n'
              '**Informacje o wydaniu:**'
          )
          if roadmap.count(old_roadmap) != 1:
              raise SystemExit('Generated stable-roadmap footer was not found exactly once.')
          roadmap_path.write_text(
              roadmap.replace(old_roadmap, new_roadmap, 1),
              encoding='utf-8',
          )

          checklist_path = Path('docs/SEO_PRODUCTION_CHECKLIST.md')
          checklist = checklist_path.read_text(encoding='utf-8')
          old_checklist = '**Etap:** `0.1.4 — stabilne wydanie`  \n'
          new_checklist = '**Etap:** `0.1.4 — stabilne wydanie`\n'
          if checklist.count(old_checklist) != 1:
              raise SystemExit('Generated checklist stage line was not found exactly once.')
          checklist_path.write_text(
              checklist.replace(old_checklist, new_checklist, 1),
              encoding='utf-8',
          )
          PY

      - name: Validate source and release contracts
        shell: bash
        run: |
          python3 -m py_compile \
            tool/validate_web_seo.py \
            tool/audit_production_routes.py \
            tool/validate_production_site.py \
            tool/offline_pwa.py \
            tool/test_offline_pwa.py \
            tool/test_public_routes.py \
            tool/finalize_web_pwa.py
          node --check web/pwa_service_worker.js
          python3 tool/prepare_web_pwa.py --web-dir web
          python3 tool/validate_web_seo.py web
          python3 tool/test_public_routes.py web
          python3 tool/test_offline_pwa.py
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          release = json.loads(Path('release.json').read_text(encoding='utf-8'))
          assert release == {
              'tag': 'v0.1.4',
              'version': '0.1.4+23',
              'title': 'InfusionCalc v0.1.4',
              'notes_file': 'releases/v0.1.4.md',
              'prerelease': False,
          }
          pubspec = Path('pubspec.yaml').read_text(encoding='utf-8')
          assert re.search(r'^version:\s*0\.1\.4\+23$', pubspec, re.MULTILINE)
          metadata = Path('lib/application/app_metadata.dart').read_text(encoding='utf-8')
          assert "static const String version = '0.1.4+23';" in metadata
          assert Path('releases/v0.1.4.md').is_file()
          PY
          test ! -e .github/workflows/apply-beta1-routing.yml
          test ! -e .github/workflows/cleanup-beta1-helpers.yml
          test ! -e .github/workflows/finalize-beta1.yml
          test ! -e .github/workflows/finalize-beta1-v2.yml
          test ! -e .github/workflows/patch-beta1-accessibility.yml
          test ! -e .github/workflows/record-beta1-production-evidence.yml
          test ! -e .github/workflows/update-beta1-docs.yml
          git diff --check

      - name: Commit stable release implementation
        shell: bash
        run: |
          rm -f \
            tool/apply_release_0_1_4.py \
            .github/workflows/apply-stable-0.1.4.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -- \
            web/index.html \
            web/changelog/index.html \
            tool/validate_web_seo.py \
            tool/audit_production_routes.py \
            tool/validate_production_site.py \
            pubspec.yaml \
            lib/application/app_metadata.dart \
            release.json \
            releases/v0.1.4.md \
            CHANGELOG.md \
            ROADMAP.md \
            README.md \
            docs/SEO_DISCOVERABILITY_0.1.4.md \
            docs/SEO_PRODUCTION_CHECKLIST.md

          git add -u -- \
            tool/apply_release_0_1_4.py \
            .github/workflows/apply-stable-0.1.4.yml \
            .github/workflows/apply-beta1-routing.yml \
            .github/workflows/cleanup-beta1-helpers.yml \
            .github/workflows/finalize-beta1.yml \
            .github/workflows/finalize-beta1-v2.yml \
            .github/workflows/patch-beta1-accessibility.yml \
            .github/workflows/record-beta1-production-evidence.yml \
            .github/workflows/update-beta1-docs.yml

          git diff --cached --check
          git diff --cached --stat
          git commit -m 'release: publish stable InfusionCalc v0.1.4'
          git push origin "HEAD:${GITHUB_REF_NAME}"
