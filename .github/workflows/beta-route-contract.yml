name: Validate public route contract

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/beta-route-contract.yml'
      - 'web/**'
      - 'tool/audit_production_routes.py'
      - 'tool/test_public_routes.py'
      - 'tool/validate_web_seo.py'
      - 'tool/offline_pwa.py'
      - 'tool/test_offline_pwa.py'
      - 'tool/finalize_web_pwa.py'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/beta-route-contract.yml'
      - 'web/**'
      - 'tool/audit_production_routes.py'
      - 'tool/test_public_routes.py'
      - 'tool/validate_web_seo.py'
      - 'tool/offline_pwa.py'
      - 'tool/test_offline_pwa.py'
      - 'tool/finalize_web_pwa.py'

permissions:
  contents: read

concurrency:
  group: public-route-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate canonical routes and real 404
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Compile-check routing tooling
        run: |
          python3 -m py_compile \
            tool/audit_production_routes.py \
            tool/test_public_routes.py \
            tool/validate_web_seo.py \
            tool/offline_pwa.py \
            tool/test_offline_pwa.py \
            tool/finalize_web_pwa.py

      - name: Validate service-worker syntax
        run: node --check web/pwa_service_worker.js

      - name: Generate deterministic local assets
        run: python3 tool/prepare_web_pwa.py --web-dir web

      - name: Validate source SEO and route contracts
        run: |
          python3 tool/validate_web_seo.py web
          python3 tool/test_public_routes.py web
          python3 tool/test_offline_pwa.py
