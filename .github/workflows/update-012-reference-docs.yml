name: Update 0.1.2 reference documentation

on:
  push:
    branches:
      - feature/0.1.2-dev.1-technical-reference-oracle
    paths:
      - tool/.update_012_reference_docs_trigger

permissions:
  contents: write

concurrency:
  group: update-012-reference-docs
  cancel-in-progress: true

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out oracle branch
        uses: actions/checkout@v6
        with:
          ref: feature/0.1.2-dev.1-technical-reference-oracle
          fetch-depth: 0

      - name: Update documentation
        run: python3 tool/update_012_reference_docs.py

      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md CHANGELOG.md ROADMAP.md
          if git diff --cached --quiet; then
            echo "No documentation changes required."
            exit 0
          fi
          git commit -m "docs: document 0.1.2 technical reference oracle"
          git push origin HEAD:feature/0.1.2-dev.1-technical-reference-oracle
