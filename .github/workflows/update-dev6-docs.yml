name: Update dev.6 documentation

on:
  push:
    branches:
      - feature/0.1.0-dev.6-preferences-hardening

permissions:
  contents: write

concurrency:
  group: update-dev6-documentation
  cancel-in-progress: true

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v6
        with:
          ref: feature/0.1.0-dev.6-preferences-hardening
          fetch-depth: 0

      - name: Update documentation
        run: python3 tool/update_dev6_docs.py

      - name: Commit documentation changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md ROADMAP.md CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No documentation changes required."
            exit 0
          fi
          git commit -m "docs: update project status for dev.6"
          git push origin HEAD:feature/0.1.0-dev.6-preferences-hardening
