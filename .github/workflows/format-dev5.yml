name: Repair dev.5 widget test

on:
  push:
    branches:
      - feature/0.1.0-dev.5-ui-integration

permissions:
  contents: write

concurrency:
  group: repair-dev5-widget-test
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.8
  FLUTTER_SHA256: 672089e001571a9fbb209a495c583580c0c6c73ef98999264ba07fa93ace332d

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v6
        with:
          ref: feature/0.1.0-dev.5-ui-integration
          fetch-depth: 0

      - name: Cache Flutter SDK
        uses: actions/cache@v5
        with:
          path: ~/.cache/kalkulator-lekow/flutter-${{ env.FLUTTER_VERSION }}
          key: flutter-linux-${{ env.FLUTTER_VERSION }}-${{ env.FLUTTER_SHA256 }}

      - name: Install verified Flutter SDK
        run: |
          FLUTTER_BIN="$(./tool/install_flutter_linux.sh)"
          echo "${FLUTTER_BIN}" >> "${GITHUB_PATH}"

      - name: Repair test and format source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('test/presentation/calculator_screen_test.dart')
          source = path.read_text()
          old = """    expect(find.text('Wartość musi być większa od zera.'), findsOneWidget);\n    expect(find.text('Sprawdź dane'), findsOneWidget);\n"""
          new = """    expect(find.text('Wartość musi być większa od zera.'), findsOneWidget);\n    await _reveal(tester, find.text('Sprawdź dane'));\n    expect(find.text('Sprawdź dane'), findsOneWidget);\n"""
          if old not in source:
              raise SystemExit('Expected test block was not found.')
          path.write_text(source.replace(old, new, 1))
          PY
          dart format lib test

      - name: Commit test repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- lib test
          if git diff --cached --quiet; then
            echo "No test changes required."
            exit 0
          fi
          git commit -m "test: reveal error summary before assertion"
          git push origin HEAD:feature/0.1.0-dev.5-ui-integration
