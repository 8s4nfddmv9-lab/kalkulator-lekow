name: Format SEO dev.2 Dart source

on:
  push:
    branches:
      - feature/0.1.4-dev.2-static-pages
    paths:
      - '.github/workflows/format-seo-dev2-dart.yml'

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.44.8
  FLUTTER_SHA256: 672089e001571a9fbb209a495c583580c0c6c73ef98999264ba07fa93ace332d

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v6

      - name: Cache Flutter SDK
        uses: actions/cache@v5
        with:
          path: ~/.cache/kalkulator-lekow/flutter-${{ env.FLUTTER_VERSION }}
          key: flutter-linux-${{ env.FLUTTER_VERSION }}-${{ env.FLUTTER_SHA256 }}

      - name: Install verified Flutter SDK
        run: |
          FLUTTER_BIN="$(./tool/install_flutter_linux.sh)"
          echo "${FLUTTER_BIN}" >> "${GITHUB_PATH}"

      - name: Format footer source
        run: dart format lib/presentation/common/app_footer.dart

      - name: Commit exact Dart formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- lib/presentation/common/app_footer.dart
          git diff --cached --check
          git commit -m 'style: format SEO footer changes'
          git push origin "HEAD:${GITHUB_REF_NAME}"
