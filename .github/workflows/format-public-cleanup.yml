name: Format public cleanup change

on:
  push:
    branches:
      - chore/public-deployment-cleanup-footer
    paths:
      - 'tool/.format_public_cleanup_trigger'

permissions:
  contents: write

concurrency:
  group: format-public-cleanup
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      FLUTTER_VERSION: 3.44.8
      FLUTTER_SHA256: 672089e001571a9fbb209a495c583580c0c6c73ef98999264ba07fa93ace332d

    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v6
        with:
          ref: chore/public-deployment-cleanup-footer
          fetch-depth: 0

      - name: Cache Flutter SDK
        uses: actions/cache@v5
        with:
          path: ~/.cache/kalkulator-lekow/flutter-${{ env.FLUTTER_VERSION }}
          key: flutter-linux-${{ env.FLUTTER_VERSION }}-${{ env.FLUTTER_SHA256 }}

      - name: Install verified Flutter SDK
        run: |
          FLUTTER_BIN="$(./tool/install_flutter_linux.sh)"
          echo "${FLUTTER_BIN}" >> "${GITHUB_PATH}"

      - name: Format changed Dart files
        run: |
          dart format \
            lib/app.dart \
            lib/presentation/common/app_footer.dart \
            lib/presentation/common/external_link.dart \
            lib/presentation/common/external_link_stub.dart \
            lib/presentation/common/external_link_web.dart \
            test/presentation/app_footer_test.dart

      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            lib/app.dart \
            lib/presentation/common/app_footer.dart \
            lib/presentation/common/external_link.dart \
            lib/presentation/common/external_link_stub.dart \
            lib/presentation/common/external_link_web.dart \
            test/presentation/app_footer_test.dart
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "style: format footer implementation"
          git push origin HEAD:chore/public-deployment-cleanup-footer
