name: Cleanup 0.1.4 beta.1 helper workflows

on:
  push:
    branches:
      - feature/0.1.4-beta.1-routing-validation
    paths:
      - '.github/workflows/cleanup-beta1-helpers.yml'

permissions:
  actions: read
  contents: write

jobs:
  cleanup:
    name: Remove one-time beta helper workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v6

      - name: Wait for one-time patch workflows to finish
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          names = {
              'Apply 0.1.4 beta.1 routing validation',
              'Patch 0.1.4 beta.1 viewport accessibility',
              'Update 0.1.4 beta.1 documentation',
          }
          repository = os.environ['REPOSITORY']
          branch = urllib.parse.quote(os.environ['BRANCH'], safe='')
          token = os.environ['GH_TOKEN']
          url = (
              f'https://api.github.com/repos/{repository}/actions/runs'
              f'?branch={branch}&per_page=100'
          )

          for _ in range(90):
              request = urllib.request.Request(
                  url,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  payload = json.load(response)
              active = [
                  run
                  for run in payload.get('workflow_runs', [])
                  if run.get('name') in names
                  and run.get('status') != 'completed'
              ]
              if not active:
                  break
              time.sleep(5)
          else:
              raise SystemExit('Timed out waiting for beta helper workflows.')

          failed = [
              run
              for run in payload.get('workflow_runs', [])
              if run.get('name') in names
              and run.get('status') == 'completed'
              and run.get('conclusion') != 'success'
          ]
          if failed:
              details = ', '.join(
                  f"{run.get('name')}={run.get('conclusion')}"
                  for run in failed
              )
              raise SystemExit(f'One-time beta workflow failed: {details}')
          PY

      - name: Remove helper workflows and commit clean branch
        shell: bash
        run: |
          rm -f \
            .github/workflows/apply-beta1-routing.yml \
            .github/workflows/patch-beta1-accessibility.yml \
            .github/workflows/update-beta1-docs.yml \
            .github/workflows/cleanup-beta1-helpers.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- .github/workflows
          git diff --cached --check
          git commit -m 'chore: remove beta implementation helpers'
          git push origin "HEAD:${GITHUB_REF_NAME}"
