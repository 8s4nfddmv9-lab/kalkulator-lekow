name: Apply MIT license documentation

on:
  push:
    branches:
      - chore/add-mit-license
    paths:
      - 'tool/.apply_mit_license_docs_trigger'

permissions:
  contents: write

concurrency:
  group: apply-mit-license-docs
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      FLUTTER_VERSION: 3.44.8
      FLUTTER_SHA256: 672089e001571a9fbb209a495c583580c0c6c73ef98999264ba07fa93ace332d

    steps:
      - name: Check out license branch
        uses: actions/checkout@v6
        with:
          ref: chore/add-mit-license
          fetch-depth: 0

      - name: Update README and changelog
        run: python3 tool/apply_mit_license_docs.py

      - name: Cache Flutter SDK
        uses: actions/cache@v5
        with:
          path: ~/.cache/kalkulator-lekow/flutter-${{ env.FLUTTER_VERSION }}
          key: flutter-linux-${{ env.FLUTTER_VERSION }}-${{ env.FLUTTER_SHA256 }}

      - name: Install verified Flutter SDK
        run: |
          FLUTTER_BIN="$(./tool/install_flutter_linux.sh)"
          echo "${FLUTTER_BIN}" >> "${GITHUB_PATH}"

      - name: Format changed Dart files
        run: |
          dart format \
            lib/presentation/common/app_footer.dart \
            test/presentation/app_footer_test.dart

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            README.md \
            CHANGELOG.md \
            lib/presentation/common/app_footer.dart \
            test/presentation/app_footer_test.dart
          if git diff --cached --quiet; then
            echo "No generated changes required."
            exit 0
          fi
          git commit -m "docs: document MIT licensing"
          git push origin HEAD:chore/add-mit-license
