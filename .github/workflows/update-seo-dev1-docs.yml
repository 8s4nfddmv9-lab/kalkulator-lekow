name: Update SEO dev.1 documentation

on:
  push:
    branches:
      - feature/0.1.4-dev.1-seo-foundations
    paths:
      - '.github/workflows/update-seo-dev1-docs.yml'

permissions:
  contents: write

concurrency:
  group: update-seo-dev1-documentation
  cancel-in-progress: false

jobs:
  update:
    name: Update roadmap and changelog
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v6

      - name: Apply documentation updates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          roadmap_path = Path('ROADMAP.md')
          roadmap = roadmap_path.read_text(encoding='utf-8')
          roadmap = roadmap.replace(
              '**Stan na:** 4 sierpnia 2026  \n'
              '**Aktualny etap:** `0.1.3 — pierwsze stabilne wydanie`',
              '**Stan na:** 5 sierpnia 2026  \n'
              '**Aktualny etap:** `0.1.4-dev.1 — fundamenty SEO i walidacja`',
              1,
          )

          start = roadmap.index('### 0.1.4 — Dostępność i ergonomia')
          end = roadmap.index('\n---\n\n## 0.2.0', start)
          replacement = '''### 0.1.4-dev.1 — Fundamenty SEO i walidacja **← obecnie**

**Cel:** umożliwić wyszukiwarkom poprawne odkrycie i opisanie strony głównej bez dodawania ekranu wejściowego przed kalkulatorem.

- [x] wersjonowany audyt bazowy indeksowania, metadanych, routingu, CI i PWA;
- [x] opisowy polski tytuł i meta description;
- [x] jawne `robots` i canonical `https://infusioncalc.eu/`;
- [x] Open Graph oraz Twitter Card;
- [x] techniczny JSON-LD typu `WebApplication` bez twierdzeń klinicznych;
- [x] `robots.txt` ze wskazaniem mapy witryny;
- [x] początkowy `sitemap.xml` zawierający stronę główną;
- [x] lokalny, deterministycznie generowany obraz social preview `1200×630`;
- [x] walidator HTML, canonical, danych społecznościowych, JSON-LD, robots, sitemap i PNG;
- [x] włączenie walidacji SEO do finalizacji produkcyjnego artefaktu;
- [x] zachowanie pełnego cache offline i ścisłego testu online → offline;
- [x] zielone testy Flutter oraz buildy PWA, Androida i iOS;
- [ ] scalenie PR i produkcyjne potwierdzenie po wdrożeniu.

**Dokumentacja:** [`docs/SEO_DISCOVERABILITY_0.1.4.md`](docs/SEO_DISCOVERABILITY_0.1.4.md) i [`docs/SEO_BASELINE_AUDIT_0.1.4_2026-08-04.md`](docs/SEO_BASELINE_AUDIT_0.1.4_2026-08-04.md).

### 0.1.4-dev.2 — Statyczne strony informacyjne

- [ ] `/about/` jako niezależna, indeksowalna strona informacyjna;
- [ ] `/privacy/` jako statyczna polityka prywatności;
- [ ] `/changelog/` jako statyczna historia wydań;
- [ ] dyskretny link `About` w stopce kalkulatora;
- [ ] unikalne tytuły, opisy, canonical i dane społecznościowe podstron;
- [ ] działanie treści informacyjnych bez uruchamiania Fluttera.

### 0.1.4-beta.1 — Routing, 404 i produkcyjna walidacja

- [ ] spójna polityka końcowych ukośników i bezpośrednich wejść;
- [ ] własny `404.html` bez soft 404;
- [ ] rozszerzona mapa witryny;
- [ ] przeglądarkowe testy wszystkich publicznych adresów;
- [ ] Lighthouse mobile i desktop;
- [ ] weryfikacja podglądu linku i danych strukturalnych;
- [ ] kontrola działania offline po aktualizacji.

### 0.1.4 — Indeksowanie i widoczność wyszukiwarkowa

- [ ] Google Search Console i weryfikacja własności domeny;
- [ ] Bing Webmaster Tools;
- [ ] przesłanie `sitemap.xml`;
- [ ] kontrola `/` oraz `/about/` i zgłoszenie do indeksacji;
- [ ] produkcyjna obserwacja canonical, renderowania i błędów indeksowania;
- [ ] stabilne wydanie `v0.1.4` po przejściu wszystkich bramek.

### 0.1.5 — Dostępność i ergonomia

- [ ] duże rozmiary tekstu;
- [ ] czytniki ekranowe;
- [ ] kontrast i tryb ciemny;
- [ ] ergonomia obsługi jedną ręką;
- [ ] obsługa różnych rozmiarów ekranów;
- [ ] ograniczenie przypadkowych zmian jednostki;
- [ ] haptyczne lub wizualne potwierdzenie konfliktu bez polegania wyłącznie na kolorze.
'''
          roadmap = roadmap[:start] + replacement + roadmap[end:]

          nearest = roadmap.rfind('## Najbliższy krok')
          if nearest < 0:
              raise SystemExit('ROADMAP.md is missing the nearest-step section.')
          roadmap = roadmap[:nearest] + '''## Najbliższy krok

Dokończyć przegląd i scalenie `0.1.4-dev.1`, następnie rozpocząć `0.1.4-dev.2`: statyczne, indeksowalne strony `/about/`, `/privacy/` i `/changelog/` bez zmiany bezpośredniego wejścia do kalkulatora.
'''
          roadmap_path.write_text(roadmap, encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          marker = '## [Unreleased]\n'
          entry = '''## [Unreleased]

### Dodano — `0.1.4-dev.1`

- audyt bazowy indeksowania i widoczności publicznego PWA;
- canonical, Open Graph, Twitter Card i techniczny JSON-LD strony głównej;
- `robots.txt` oraz początkową mapę `sitemap.xml`;
- lokalny, deterministycznie generowany obraz podglądu `1200×630`;
- walidator produkcyjnego kontraktu SEO obejmujący HTML, metadane, JSON-LD, robots, sitemap i PNG.

### Testy

- walidacja SEO jest obowiązkową częścią finalizacji produkcyjnego artefaktu;
- paczka obejmuje 46 wersjonowanych plików offline;
- ścisły test uruchomienia po wyczyszczeniu zwykłego cache HTTP i odcięciu sieci pozostaje zielony;
- pełne testy Flutter oraz buildy PWA, Androida i iOS pozostają zielone.

### Granice

- strona główna nadal otwiera kalkulator bez ekranu marketingowego i dodatkowego kliknięcia;
- brak zmian w solverze, wzorach, jednostkach, precyzji i danych formularza;
- brak nowych trackerów, reklam i cookies marketingowych;
- statyczne strony informacyjne pozostają zakresem `0.1.4-dev.2`.
'''
          if changelog.count(marker) != 1:
              raise SystemExit('Unexpected CHANGELOG.md Unreleased marker count.')
          changelog = changelog.replace(marker, entry, 1)
          changelog_path.write_text(changelog, encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          anchor = '- [Analityka](docs/ANALYTICS.md)\n'
          addition = (
              anchor
              + '- [Plan indeksowania i widoczności 0.1.4](docs/SEO_DISCOVERABILITY_0.1.4.md)\n'
              + '- [Audyt bazowy SEO 0.1.4](docs/SEO_BASELINE_AUDIT_0.1.4_2026-08-04.md)\n'
          )
          if readme.count(anchor) != 1:
              raise SystemExit('Unexpected README analytics anchor count.')
          readme = readme.replace(anchor, addition, 1)
          readme_path.write_text(readme, encoding='utf-8')
          PY

      - name: Commit documentation and remove helper workflow
        shell: bash
        run: |
          rm -f .github/workflows/update-seo-dev1-docs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- ROADMAP.md CHANGELOG.md README.md
          git add -u -- .github/workflows/update-seo-dev1-docs.yml
          git diff --cached --stat
          git commit -m 'docs: record completion of SEO foundations'
          git push origin "HEAD:${GITHUB_REF_NAME}"
