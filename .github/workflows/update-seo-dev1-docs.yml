name: Update SEO dev.1 documentation

on:
  push:
    branches:
      - feature/0.1.4-dev.1-seo-foundations
    paths:
      - '.github/workflows/update-seo-dev1-docs.yml'

permissions:
  contents: write

concurrency:
  group: update-seo-dev1-documentation
  cancel-in-progress: false

jobs:
  update:
    name: Update roadmap and changelog
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v6

      - name: Apply documentation updates
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path

          def decode(value: str) -> str:
              return base64.b64decode(value).decode('utf-8')

          roadmap_section = decode('')
          nearest_step = decode('')
          changelog_entry = decode('')
          readme_links = decode('LSBbQW5hbGl0eWthXShkb2NzL0FOQUxZVElDUy5tZCkKLSBbUGxhbiBpbmRla3Nvd2FuaWEgaSB3aWRvY3pub8WbY2kgMC4xLjRdKGRvY3MvU0VPX0RJU0NPVkVSQUJJTElUWV8wLjEuNC5tZCkKLSBbQXVkeXQgYmF6b3d5IFNFTyAwLjEuNF0oZG9jcy9TRU9fQkFTRUxJTkVfQVVESVRfMC4xLjRfMjAyNi0wOC0wNC5tZCkK')

          roadmap_path = Path('ROADMAP.md')
          roadmap = roadmap_path.read_text(encoding='utf-8')
          old_header = (
              '**Stan na:** 4 sierpnia 2026  \n'
              '**Aktualny etap:** `0.1.3 — pierwsze stabilne wydanie`'
          )
          new_header = (
              '**Stan na:** 5 sierpnia 2026  \n'
              '**Aktualny etap:** `0.1.4-dev.1 — fundamenty SEO i walidacja`'
          )
          if roadmap.count(old_header) != 1:
              raise SystemExit('Unexpected ROADMAP header state.')
          roadmap = roadmap.replace(old_header, new_header, 1)

          start = roadmap.index('### 0.1.4 — Dostępność i ergonomia')
          end = roadmap.index('\n---\n\n## 0.2.0', start)
          roadmap = roadmap[:start] + roadmap_section + roadmap[end:]

          nearest = roadmap.rfind('## Najbliższy krok')
          if nearest < 0:
              raise SystemExit('ROADMAP.md is missing the nearest-step section.')
          roadmap = roadmap[:nearest] + nearest_step
          roadmap_path.write_text(roadmap, encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          marker = '## [Unreleased]\n'
          if changelog.count(marker) != 1:
              raise SystemExit('Unexpected CHANGELOG Unreleased marker count.')
          changelog = changelog.replace(marker, changelog_entry, 1)
          changelog_path.write_text(changelog, encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          anchor = '- [Analityka](docs/ANALYTICS.md)\n'
          if readme.count(anchor) != 1:
              raise SystemExit('Unexpected README analytics anchor count.')
          readme = readme.replace(anchor, readme_links, 1)
          readme_path.write_text(readme, encoding='utf-8')
          PY

      - name: Commit documentation and remove helper workflow
        shell: bash
        run: |
          rm -f .github/workflows/update-seo-dev1-docs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- ROADMAP.md CHANGELOG.md README.md
          git add -u -- .github/workflows/update-seo-dev1-docs.yml
          git diff --cached --stat
          git commit -m 'docs: record completion of SEO foundations'
          git push origin "HEAD:${GITHUB_REF_NAME}"
