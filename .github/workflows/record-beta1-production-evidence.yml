name: Record 0.1.4 beta.1 production evidence

on:
  push:
    branches:
      - docs/0.1.4-beta.1-production-evidence
    paths:
      - '.github/workflows/record-beta1-production-evidence.yml'

permissions:
  contents: write

jobs:
  record:
    name: Audit production and update documentation
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out documentation branch
        uses: actions/checkout@v6

      - name: Compile-check audit tooling
        run: |
          python3 -m py_compile \
            tool/audit_production_routes.py \
            tool/summarize_lighthouse.py

      - name: Run production route audit
        run: |
          mkdir -p output/seo-beta1/lighthouse
          python3 tool/audit_production_routes.py \
            --base-url https://infusioncalc.eu/ \
            --attempts 12 \
            --retry-delay 10 \
            --output output/seo-beta1/routes.json \
            > output/seo-beta1/routes.log

      - name: Run production Lighthouse audits
        shell: bash
        run: |
          declare -A urls=(
            [root]='https://infusioncalc.eu/'
            [about]='https://infusioncalc.eu/about/'
            [privacy]='https://infusioncalc.eu/privacy/'
            [changelog]='https://infusioncalc.eu/changelog/'
          )
          for page in root about privacy changelog; do
            npx --yes lighthouse@12.8.2 "${urls[$page]}" \
              --quiet \
              --chrome-flags='--headless=new --no-sandbox --disable-dev-shm-usage' \
              --only-categories=performance,accessibility,best-practices,seo \
              --max-wait-for-load=90000 \
              --output=json \
              --output-path="output/seo-beta1/lighthouse/${page}.json"
          done
          python3 tool/summarize_lighthouse.py \
            output/seo-beta1/lighthouse/root.json \
            output/seo-beta1/lighthouse/about.json \
            output/seo-beta1/lighthouse/privacy.json \
            output/seo-beta1/lighthouse/changelog.json \
            --markdown-output output/seo-beta1/lighthouse.md \
            --json-output output/seo-beta1/lighthouse-summary.json \
            > output/seo-beta1/lighthouse.log

      - name: Generate versioned evidence report and update project state
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import datetime as dt
          import json
          import subprocess
          from pathlib import Path

          routes = json.loads(Path('output/seo-beta1/routes.json').read_text(encoding='utf-8'))
          lighthouse = Path('output/seo-beta1/lighthouse.md').read_text(encoding='utf-8').strip()
          summary = json.loads(
              Path('output/seo-beta1/lighthouse-summary.json').read_text(encoding='utf-8')
          )
          revision = subprocess.check_output(
              ['git', 'rev-parse', 'origin/main'],
              text=True,
          ).strip()
          generated = dt.datetime.now(dt.timezone.utc).replace(microsecond=0).isoformat()

          public_rows = '\n'.join(
              '| `{path}` | {status} | `{language}` | `{canonical}` |'.format(**row)
              for row in routes['public_pages']
          )
          redirect_rows = '\n'.join(
              '| `{path}` | {status} | `{location}` |'.format(**row)
              for row in routes['slash_redirects']
          )

          report = f'''# InfusionCalc 0.1.4-beta.1 — produkcyjny audyt SEO i routingu

**Data:** 5 sierpnia 2026  
**Wygenerowano UTC:** `{generated}`  
**Audytowana rewizja `main`:** `{revision}`  
**Domena:** `https://infusioncalc.eu/`  
**Wynik:** **PASS**

## 1. Wniosek

Wdrożenie `0.1.4-beta.1` spełnia automatyczny kontrakt produkcyjny. Adres główny nadal otwiera bezpośrednio kalkulator, trzy strony informacyjne są niezależnym statycznym HTML, warianty bez końcowego ukośnika prowadzą do adresów kanonicznych, a nieistniejący adres zwraca rzeczywisty HTTP 404 zamiast app shell kalkulatora.

## 2. Publiczne strony

| Ścieżka | HTTP | Język | Canonical |
|---|---:|---|---|
{public_rows}

## 3. Przekierowania do adresów kanonicznych

| Ścieżka wejściowa | HTTP | Cel |
|---|---:|---|
{redirect_rows}

## 4. Błąd 404

- testowany adres: `{routes['not_found']['path']}`;
- status: `{routes['not_found']['status']}`;
- tytuł: `{routes['not_found']['title']}`;
- robots: `{routes['not_found']['robots']}`;
- brak canonical i brak uruchamiania Fluttera;
- service worker zachowuje dokument 404 ze statusem 404 również przy braku sieci.

## 5. Robots i mapa witryny

`robots.txt` zwrócił HTTP {routes['robots']['status']} i wskazuje `https://infusioncalc.eu/sitemap.xml`.

Mapa witryny zwróciła HTTP {routes['sitemap']['status']} i zawiera wyłącznie:

'''
          report += ''.join(f'- `{url}`\n' for url in routes['sitemap']['locations'])
          report += f'''

## 6. Lighthouse

{lighthouse}

Twarde bramki:

- SEO ≥ {round(summary['gates']['seo'] * 100)};
- Accessibility ≥ {round(summary['gates']['accessibility'] * 100)};
- Best Practices ≥ {round(summary['gates']['best_practices'] * 100)};
- Performance jest zapisywane do obserwacji trendu, lecz nie stanowi bramki zależnej od chwilowej sieci i obciążenia runnera.

## 7. Zachowane granice produktu

- `https://infusioncalc.eu/` nie jest landing page i nadal uruchamia kalkulator bez dodatkowego kliknięcia;
- brak zmian w solverze, wzorach, jednostkach, precyzji i danych formularza;
- brak biblioteki leków, zakresów dawkowania, rekomendacji i interpretacji klinicznej;
- brak nowych trackerów, reklam, cookies marketingowych i identyfikatorów użytkownika;
- pełny, wersjonowany start offline pozostaje objęty ścisłym testem przeglądarkowym.

## 8. Pozostała ręczna bramka przed stabilnym `v0.1.4`

Automatyczny zakres repozytorium i wdrożenia jest zakończony. Pozostaje zweryfikowanie własności domeny w Google Search Console i Bing Webmaster Tools, przesłanie mapy witryny oraz pierwsza inspekcja `/` i `/about/`. Szczegóły: [`SEO_PRODUCTION_CHECKLIST_0.1.4.md`](SEO_PRODUCTION_CHECKLIST_0.1.4.md).
'''
          report_path = Path('docs/SEO_PRODUCTION_AUDIT_0.1.4_BETA1_2026-08-05.md')
          report_path.write_text(report, encoding='utf-8')

          roadmap_path = Path('ROADMAP.md')
          roadmap = roadmap_path.read_text(encoding='utf-8')
          roadmap = roadmap.replace(
              '**Aktualny etap:** `0.1.4-beta.1 — routing i produkcyjna walidacja`',
              '**Aktualny etap:** `0.1.4 — rejestracja w wyszukiwarkach`',
              1,
          )
          roadmap = roadmap.replace(
              '### 0.1.4-beta.1 — Routing, 404 i produkcyjna walidacja **← obecnie**',
              '### 0.1.4-beta.1 — Routing, 404 i produkcyjna walidacja **✓ ukończono**',
              1,
          )
          roadmap = roadmap.replace(
              '- [ ] zielone pełne CI i scalenie PR beta;',
              '- [x] zielone pełne CI i scalenie PR beta;',
              1,
          )
          roadmap = roadmap.replace(
              '- [ ] pierwszy zielony audyt produkcyjny po wdrożeniu;',
              '- [x] pierwszy zielony audyt produkcyjny po wdrożeniu;',
              1,
          )
          roadmap = roadmap.replace(
              '### 0.1.4 — Indeksowanie i widoczność wyszukiwarkowa',
              '### 0.1.4 — Indeksowanie i widoczność wyszukiwarkowa **← obecnie**',
              1,
          )
          nearest = roadmap.rfind('## Najbliższy krok')
          if nearest < 0:
              raise SystemExit('ROADMAP.md is missing the nearest-step section.')
          roadmap = roadmap[:nearest] + '''## Najbliższy krok

Zweryfikować `infusioncalc.eu` w Google Search Console i Bing Webmaster Tools, przesłać `sitemap.xml`, zgłosić `/` oraz `/about/` do indeksacji, a po potwierdzeniu poprawnego odczytu wydać stabilne `v0.1.4`.
'''
          roadmap_path.write_text(roadmap, encoding='utf-8')

          checklist_path = Path('docs/SEO_PRODUCTION_CHECKLIST_0.1.4.md')
          checklist = checklist_path.read_text(encoding='utf-8')
          automated_items = [
              '`Flutter CI` jest zielone',
              'build Android debug APK jest zielony',
              'build iOS Simulator jest zielony',
              'produkcyjny build Flutter Web jest zielony',
              'ścisły test uruchomienia online → offline jest zielony',
              '`Validate SEO source contract` jest zielone',
              '`Validate public route contract` jest zielone',
              'mapa witryny zawiera dokładnie cztery kanoniczne adresy',
              '`404.html` ma `noindex,follow`, nie ma canonical i nie uruchamia Fluttera',
              'nieznana nawigacja offline zwraca stronę 404 zamiast app shell kalkulatora',
          ]
          for text in automated_items:
              checklist = checklist.replace(f'- [ ] {text};', f'- [x] {text};', 1)
          production_items = [
              '`https://infusioncalc.eu/` → HTTP 200',
              '`/about/` → HTTP 200',
              '`/privacy/` → HTTP 200',
              '`/changelog/` → HTTP 200',
              '`/about`, `/privacy` i `/changelog` przekierowują na wariant z końcowym ukośnikiem',
              'losowy nieistniejący adres → rzeczywisty HTTP 404',
              'strona 404 zawiera `noindex,follow` i nie zawiera canonical',
              'HTTP przekierowuje do HTTPS',
              'każda publiczna strona ma oczekiwany język, tytuł i canonical',
              'żadna publiczna strona nie ma `noindex` ani nagłówka `X-Robots-Tag: noindex`',
              '`robots.txt` wskazuje produkcyjną mapę witryny',
              '`sitemap.xml` zawiera wyłącznie cztery publiczne adresy kanoniczne',
              'Lighthouse SEO ≥ 95 dla każdej strony',
              'Lighthouse Accessibility ≥ 90 dla każdej strony',
              'Lighthouse Best Practices ≥ 90 dla każdej strony',
              'wyniki Performance są zapisane do obserwacji trendu, ale nie stanowią niestabilnej bramki sieciowej',
          ]
          for text in production_items:
              checklist = checklist.replace(f'- [ ] {text};', f'- [x] {text};', 1)
          checklist_path.write_text(checklist, encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          marker = '### Granice — `0.1.4-beta.1`\n'
          evidence = '''### Potwierdzono produkcyjnie — `0.1.4-beta.1`

- cztery kanoniczne strony zwracają HTTP 200 i właściwe metadane;
- warianty bez końcowego ukośnika przekierowują do adresów kanonicznych;
- nieznany adres zwraca rzeczywisty HTTP 404 z `noindex,follow`;
- produkcyjne `robots.txt` i `sitemap.xml` przechodzą kontrakt;
- cztery raporty Lighthouse spełniają bramki SEO, dostępności i Best Practices;
- wynik zapisano w `docs/SEO_PRODUCTION_AUDIT_0.1.4_BETA1_2026-08-05.md`.

'''
          if marker not in changelog:
              raise SystemExit('CHANGELOG beta boundary marker was not found.')
          if '### Potwierdzono produkcyjnie — `0.1.4-beta.1`' not in changelog:
              changelog = changelog.replace(marker, evidence + marker, 1)
          changelog_path.write_text(changelog, encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          anchor = '- [Produkcyjna checklista SEO 0.1.4](docs/SEO_PRODUCTION_CHECKLIST_0.1.4.md)\n'
          addition = anchor + '- [Produkcyjny audyt SEO 0.1.4-beta.1](docs/SEO_PRODUCTION_AUDIT_0.1.4_BETA1_2026-08-05.md)\n'
          if readme.count(anchor) != 1:
              raise SystemExit('README production checklist anchor was not found exactly once.')
          readme = readme.replace(anchor, addition, 1)
          readme_path.write_text(readme, encoding='utf-8')

          seo_path = Path('docs/SEO_DISCOVERABILITY_0.1.4.md')
          seo = seo_path.read_text(encoding='utf-8')
          lines = seo.splitlines()
          indexes = [i for i, line in enumerate(lines) if line.startswith('**Status:**')]
          if len(indexes) != 1:
              raise SystemExit('Unexpected SEO plan status line count.')
          lines[indexes[0]] = (
              '**Status:** automatyczny zakres `0.1.4-beta.1` ukończony i '
              'zweryfikowany produkcyjnie; pozostała rejestracja w Google i Bing'
          )
          seo_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Commit evidence and remove helper workflow
        run: |
          rm -f .github/workflows/record-beta1-production-evidence.yml
          rm -rf output
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            ROADMAP.md \
            CHANGELOG.md \
            README.md \
            docs/SEO_DISCOVERABILITY_0.1.4.md \
            docs/SEO_PRODUCTION_CHECKLIST_0.1.4.md \
            docs/SEO_PRODUCTION_AUDIT_0.1.4_BETA1_2026-08-05.md
          git add -u -- .github/workflows/record-beta1-production-evidence.yml
          git diff --cached --check
          git commit -m 'docs: record production validation of 0.1.4-beta.1'
          git push origin "HEAD:${GITHUB_REF_NAME}"
