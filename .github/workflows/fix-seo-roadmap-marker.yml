name: Fix SEO roadmap current marker

on:
  push:
    branches:
      - feature/0.1.4-dev.1-seo-foundations
    paths:
      - '.github/workflows/fix-seo-roadmap-marker.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v6

      - name: Fix previous-stage marker
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('ROADMAP.md')
          source = path.read_text(encoding='utf-8')
          old = '### 0.1.3 — Pierwsze stabilne wydanie **← obecnie**'
          new = '### 0.1.3 — Pierwsze stabilne wydanie **✓ ukończono**'
          if source.count(old) != 1:
              raise SystemExit('Unexpected 0.1.3 roadmap marker state.')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit correction and remove helper workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-seo-roadmap-marker.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- ROADMAP.md
          git add -u -- .github/workflows/fix-seo-roadmap-marker.yml
          git commit -m 'docs: mark stable 0.1.3 as completed'
          git push origin "HEAD:${GITHUB_REF_NAME}"
