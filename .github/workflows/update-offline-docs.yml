name: Update complete offline PWA documentation

on:
  push:
    branches:
      - feature/0.1.3-beta.4-offline-pwa
    paths:
      - 'tool/.update_offline_docs_trigger'

permissions:
  contents: write

concurrency:
  group: update-offline-pwa-docs
  cancel-in-progress: true

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v6
        with:
          ref: feature/0.1.3-beta.4-offline-pwa
          fetch-depth: 0

      - name: Update project documentation
        run: python3 tool/update_offline_docs.py

      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md ROADMAP.md CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No documentation changes required."
            exit 0
          fi
          git commit -m "docs: document complete offline PWA support"
          git push origin HEAD:feature/0.1.3-beta.4-offline-pwa
