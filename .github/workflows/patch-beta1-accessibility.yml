name: Patch 0.1.4 beta.1 viewport accessibility

on:
  push:
    branches:
      - feature/0.1.4-beta.1-routing-validation
    paths:
      - '.github/workflows/patch-beta1-accessibility.yml'

permissions:
  contents: write

jobs:
  patch:
    name: Remove viewport zoom restriction
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out branch
        uses: actions/checkout@v6

      - name: Enable browser zoom
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('web/index.html')
          source = path.read_text(encoding='utf-8')
          old = (
              '<meta name="viewport" content="width=device-width, initial-scale=1.0, '
              'viewport-fit=cover, user-scalable=no">'
          )
          new = (
              '<meta name="viewport" content="width=device-width, initial-scale=1.0, '
              'viewport-fit=cover">'
          )
          if source.count(old) != 1:
              raise SystemExit('Expected root viewport declaration was not found exactly once.')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit viewport correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- web/index.html
          git diff --cached --check
          git commit -m 'fix: allow browser zoom on the calculator page'
          git push origin "HEAD:${GITHUB_REF_NAME}"
