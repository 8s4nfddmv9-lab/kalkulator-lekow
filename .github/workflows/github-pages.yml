name: Deploy Flutter PWA to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/github-pages.yml'
      - 'lib/**'
      - 'web/**'
      - 'tool/install_flutter_linux.sh'
      - 'tool/prepare_web_pwa.py'
      - 'tool/prepare_web_fallback_fonts.py'
      - 'tool/finalize_web_pwa.py'
      - 'tool/offline_pwa.py'
      - 'tool/test_offline_pwa.py'
      - 'tool/smoke_test_offline_pwa.py'
      - 'tool/smoke_test_public_routes.py'
      - 'tool/validate_web_seo.py'
      - 'tool/validate_web_routing.py'
      - 'tool/validate_production_site.py'
      - 'tool/run_lighthouse_audit.py'
      - 'pubspec.yaml'
      - 'pubspec.lock'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.8
  FLUTTER_SHA256: 672089e001571a9fbb209a495c583580c0c6c73ef98999264ba07fa93ace332d

jobs:
  build:
    name: Build, route-test and audit self-contained offline Flutter PWA
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Cache Flutter SDK
        uses: actions/cache@v5
        with:
          path: ~/.cache/kalkulator-lekow/flutter-${{ env.FLUTTER_VERSION }}
          key: flutter-linux-${{ env.FLUTTER_VERSION }}-${{ env.FLUTTER_SHA256 }}

      - name: Install verified Flutter SDK
        run: |
          FLUTTER_BIN="$(./tool/install_flutter_linux.sh)"
          echo "${FLUTTER_BIN}" >> "${GITHUB_PATH}"

      - name: Set up Node for pinned Lighthouse
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Test and compile-check web tooling
        run: |
          python3 tool/test_offline_pwa.py
          python3 -m py_compile \
            tool/offline_pwa.py \
            tool/test_offline_pwa.py \
            tool/smoke_test_offline_pwa.py \
            tool/smoke_test_public_routes.py \
            tool/prepare_web_fallback_fonts.py \
            tool/validate_web_seo.py \
            tool/validate_web_routing.py \
            tool/validate_production_site.py \
            tool/run_lighthouse_audit.py \
            tool/finalize_web_pwa.py

      - name: Validate browser and service-worker syntax
        run: |
          node --check web/analytics.js
          node --check web/pwa_install.js
          node --check web/pwa_service_worker.js

      - name: Generate deterministic local PWA assets
        run: |
          python3 tool/prepare_web_pwa.py --web-dir web
          python3 tool/prepare_web_fallback_fonts.py --web-dir web

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build self-contained Flutter web release
        run: |
          flutter build web \
            --release \
            --base-href / \
            --no-web-resources-cdn

      - name: Finalize and validate complete offline output
        run: |
          python3 tool/prepare_web_fallback_fonts.py \
            --web-dir build/web \
            --check-only
          python3 tool/finalize_web_pwa.py build/web "${GITHUB_SHA}"
          python3 -m json.tool build/web/offline-manifest.json >/dev/null
          test ! -e build/web/pwa_service_worker.js.tmp
          grep -q 'display.*standalone' build/web/manifest.json
          grep -q '<base href="/">' build/web/index.html
          grep -q 'BOOT_TIMEOUT' build/web/index.html
          grep -q 'fontFallbackBaseUrl' build/web/flutter_bootstrap.js
          grep -q "infusioncalc-pwa-${GITHUB_SHA}" build/web/pwa_service_worker.js
          grep -q 'await self.skipWaiting()' build/web/pwa_service_worker.js
          grep -q 'await self.clients.claim()' build/web/pwa_service_worker.js
          grep -q '"./404.html"' build/web/offline-manifest.json
          grep -q '"./main.dart.js"' build/web/offline-manifest.json
          grep -q '"./canvaskit/' build/web/offline-manifest.json
          grep -q '"./fallback-fonts/roboto/v32/KFOmCnqEu92Fr1Me4GZLCzYlKw.woff2"' \
            build/web/offline-manifest.json
          grep -q '"versioned-cache-first"' build/web/offline-manifest.json

      - name: Prove CDN-free online-to-offline calculator startup
        run: python3 tool/smoke_test_offline_pwa.py build/web

      - name: Prove canonical routes and hard 404 online and offline
        run: python3 tool/smoke_test_public_routes.py build/web

      - name: Run pinned Lighthouse mobile and desktop baseline
        run: >-
          python3 tool/run_lighthouse_audit.py build/web
          --output-dir lighthouse-reports

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-pages-${{ github.run_number }}
          path: lighthouse-reports
          if-no-files-found: warn
          retention-days: 30

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    name: Deploy and validate custom domain
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Check out deployed revision
        uses: actions/checkout@v6

      - name: Validate deployed custom domain and hard 404
        run: >-
          python3 tool/validate_production_site.py
          --expected-build "${GITHUB_SHA}"
          --attempts 36
          --delay 10
