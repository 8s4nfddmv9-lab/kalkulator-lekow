name: Apply iOS offline hotfix documentation

on:
  push:
    branches:
      - fix/0.1.3-beta.5-ios-offline-startup
    paths:
      - 'tool/.apply_ios_offline_hotfix_docs_trigger'

permissions:
  contents: write

concurrency:
  group: apply-ios-offline-hotfix-docs
  cancel-in-progress: true

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v6
        with:
          ref: fix/0.1.3-beta.5-ios-offline-startup
          fetch-depth: 0

      - name: Apply documentation updates
        run: python3 tool/apply_ios_offline_hotfix_docs.py

      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- CHANGELOG.md README.md ROADMAP.md
          if git diff --cached --quiet; then
            echo "No documentation changes required."
            exit 0
          fi
          git commit -m "docs: document iOS offline startup hotfix"
          git push origin HEAD:fix/0.1.3-beta.5-ios-offline-startup
