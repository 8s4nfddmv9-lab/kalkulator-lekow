name: Finalize 0.1.4 beta.1

on:
  push:
    branches:
      - feature/0.1.4-beta.1-routing-validation
    paths:
      - '.github/workflows/finalize-beta1.yml'

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: finalize-0.1.4-beta.1
  cancel-in-progress: false

jobs:
  finalize:
    name: Clean, validate, merge and verify deployment
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      BRANCH: feature/0.1.4-beta.1-routing-validation
      PR_NUMBER: '50'

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/0.1.4-beta.1-routing-validation
          fetch-depth: 0

      - name: Wait for one-time implementation workflows
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          watched = {
              'Apply 0.1.4 beta.1 routing validation',
              'Patch 0.1.4 beta.1 viewport accessibility',
              'Update 0.1.4 beta.1 documentation',
              'Cleanup 0.1.4 beta.1 helper workflows',
          }
          repository = os.environ['REPOSITORY']
          branch = urllib.parse.quote(os.environ['BRANCH'], safe='')
          token = os.environ['GH_TOKEN']
          url = (
              f'https://api.github.com/repos/{repository}/actions/runs'
              f'?branch={branch}&per_page=100'
          )
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          latest = {}
          for _ in range(120):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  payload = json.load(response)
              latest = {}
              for run in payload.get('workflow_runs', []):
                  name = run.get('name')
                  if name in watched and name not in latest:
                      latest[name] = run
              active = [
                  run for run in latest.values()
                  if run.get('status') != 'completed'
              ]
              if not active:
                  break
              time.sleep(5)
          else:
              raise SystemExit('Timed out waiting for beta implementation workflows.')

          failures = [
              run for run in latest.values()
              if run.get('status') == 'completed'
              and run.get('conclusion') not in {'success', 'skipped', 'cancelled'}
          ]
          if failures:
              print(
                  'Earlier helper failures were recorded; the finalizer will '
                  're-run the complete source contract before merging.'
              )
          PY

      - name: Refresh branch checkout
        run: |
          git fetch origin "${BRANCH}"
          git reset --hard "origin/${BRANCH}"

      - name: Validate final beta source contract
        shell: bash
        run: |
          python3 -m py_compile \
            tool/audit_production_routes.py \
            tool/test_public_routes.py \
            tool/summarize_lighthouse.py \
            tool/offline_pwa.py \
            tool/test_offline_pwa.py \
            tool/validate_web_seo.py \
            tool/finalize_web_pwa.py
          node --check web/analytics.js
          node --check web/pwa_install.js
          node --check web/pwa_service_worker.js
          python3 tool/prepare_web_pwa.py --web-dir web
          python3 tool/validate_web_seo.py web
          python3 tool/test_public_routes.py web
          python3 tool/test_offline_pwa.py
          grep -q 'name="robots" content="noindex,follow"' web/404.html
          ! grep -q 'rel="canonical"' web/404.html
          ! grep -q 'user-scalable=no' web/index.html
          grep -q '"./404.html"' tool/offline_pwa.py
          git diff --check

      - name: Create clean final validation commit
        shell: bash
        run: |
          rm -f \
            .github/workflows/apply-beta1-routing.yml \
            .github/workflows/patch-beta1-accessibility.yml \
            .github/workflows/update-beta1-docs.yml \
            .github/workflows/cleanup-beta1-helpers.yml \
            .github/workflows/finalize-beta1.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          rm -f \
            web/apple-touch-icon.png \
            web/icons/Icon-192.png \
            web/icons/Icon-512.png \
            web/icons/Icon-maskable-192.png \
            web/icons/Icon-maskable-512.png \
            web/social/infusioncalc-preview.png

          # Trigger all permanent PR gates on the exact clean commit without
          # changing application behavior or public content.
          python3 - <<'PY'
          from pathlib import Path

          path = Path('web/404.html')
          source = path.read_text(encoding='utf-8')
          marker = '<!-- 0.1.4-beta.1 route contract -->'
          if marker not in source:
              source = source.replace(
                  '</body>',
                  f'  {marker}\n</body>',
                  1,
              )
              path.write_text(source, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            git commit --allow-empty -m 'chore: finalize 0.1.4-beta.1 validation state'
          else
            git commit -m 'chore: finalize 0.1.4-beta.1 validation state'
          fi
          git push origin "HEAD:${BRANCH}"
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"

      - name: Wait for permanent pull-request gates
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          required = {
              'Flutter CI',
              'Validate SEO source contract',
              'Validate public route contract',
          }
          repository = os.environ['REPOSITORY']
          sha = os.environ['FINAL_SHA']
          token = os.environ['GH_TOKEN']
          url = (
              f'https://api.github.com/repos/{repository}/actions/runs'
              f'?head_sha={urllib.parse.quote(sha)}&per_page=100'
          )
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          latest = {}
          for _ in range(240):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  payload = json.load(response)
              latest = {}
              for run in payload.get('workflow_runs', []):
                  name = run.get('name')
                  if name in required and name not in latest:
                      latest[name] = run

              if required.issubset(latest):
                  incomplete = [
                      run for run in latest.values()
                      if run.get('status') != 'completed'
                  ]
                  if not incomplete:
                      break
              time.sleep(5)
          else:
              missing = sorted(required - latest.keys())
              raise SystemExit(
                  'Timed out waiting for permanent gates. '
                  f'Missing workflows: {missing}'
              )

          failed = {
              name: run.get('conclusion')
              for name, run in latest.items()
              if run.get('conclusion') != 'success'
          }
          if failed:
              raise SystemExit(f'Permanent beta gates failed: {failed}')

          print('All permanent beta gates succeeded:')
          for name in sorted(latest):
              run = latest[name]
              print(f"- {name}: {run.get('html_url')}")
          PY

      - name: Mark pull request ready and squash-merge
        shell: bash
        run: |
          gh pr ready "${PR_NUMBER}" --repo "${REPOSITORY}"
          gh pr merge "${PR_NUMBER}" \
            --repo "${REPOSITORY}" \
            --squash \
            --subject 'feat: harden routing and production SEO validation for 0.1.4-beta.1' \
            --body 'Add a real noindex 404 page, canonical trailing-slash route validation, offline 404 preservation, automated deployed-route checks, Lighthouse evidence and the production search registration checklist.'
          MERGE_SHA="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.merge_commit_sha')"
          test -n "${MERGE_SHA}"
          echo "MERGE_SHA=${MERGE_SHA}" >> "${GITHUB_ENV}"

      - name: Wait for GitHub Pages deployment
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          repository = os.environ['REPOSITORY']
          sha = os.environ['MERGE_SHA']
          token = os.environ['GH_TOKEN']
          expected = 'Deploy Flutter PWA to GitHub Pages'
          url = (
              f'https://api.github.com/repos/{repository}/actions/runs'
              f'?head_sha={urllib.parse.quote(sha)}&per_page=100'
          )
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          selected = None
          for _ in range(240):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  payload = json.load(response)
              selected = next(
                  (
                      run for run in payload.get('workflow_runs', [])
                      if run.get('name') == expected
                  ),
                  None,
              )
              if selected and selected.get('status') == 'completed':
                  break
              time.sleep(5)
          else:
              raise SystemExit('Timed out waiting for GitHub Pages deployment.')

          if selected.get('conclusion') != 'success':
              raise SystemExit(
                  'GitHub Pages deployment failed: '
                  f"{selected.get('html_url')} ({selected.get('conclusion')})"
              )
          print(f"GitHub Pages deployment succeeded: {selected.get('html_url')}")
          PY

      - name: Run production route audit immediately
        shell: bash
        run: |
          mkdir -p output/production-audit
          python3 tool/audit_production_routes.py \
            --base-url https://infusioncalc.eu/ \
            --attempts 18 \
            --retry-delay 10 \
            --output output/production-audit/routes.json

      - name: Upload immediate production evidence
        uses: actions/upload-artifact@v4
        with:
          name: infusioncalc-beta1-immediate-production-audit
          path: output/production-audit/routes.json
          if-no-files-found: error
          retention-days: 90
