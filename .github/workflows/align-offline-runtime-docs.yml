name: Align offline runtime documentation

on:
  push:
    branches:
      - fix/0.1.3-beta.6-self-contained-offline-runtime
    paths:
      - 'tool/.align_offline_runtime_docs_trigger'

permissions:
  contents: write

concurrency:
  group: align-offline-runtime-docs
  cancel-in-progress: true

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out runtime fix branch
        uses: actions/checkout@v6
        with:
          ref: fix/0.1.3-beta.6-self-contained-offline-runtime
          fetch-depth: 0

      - name: Align documentation
        run: python3 tool/align_offline_runtime_docs.py

      - name: Commit aligned documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- CHANGELOG.md ROADMAP.md docs/OFFLINE_PWA.md DEPLOYMENT.md
          if git diff --cached --quiet; then
            echo "No documentation changes required."
            exit 0
          fi
          git commit -m "docs: align offline runtime validation wording"
          git push origin HEAD:fix/0.1.3-beta.6-self-contained-offline-runtime
