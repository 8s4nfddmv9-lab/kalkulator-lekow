name: Finalize 0.1.4 beta.1 v2

on:
  push:
    branches:
      - feature/0.1.4-beta.1-routing-validation
    paths:
      - '.github/workflows/finalize-beta1-v2.yml'

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: finalize-0.1.4-beta.1
  cancel-in-progress: false

jobs:
  finalize:
    name: Race-safe clean, validation and merge
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      BRANCH: feature/0.1.4-beta.1-routing-validation
      PR_NUMBER: '50'

    steps:
      - name: Stop cleanly when an earlier finalizer already merged
        id: state
        shell: bash
        run: |
          STATE="$(gh pr view "${PR_NUMBER}" --repo "${REPOSITORY}" --json state --jq '.state')"
          echo "state=${STATE}" >> "${GITHUB_OUTPUT}"
          if [ "${STATE}" = 'MERGED' ]; then
            echo 'PR #50 is already merged; no duplicate finalization is required.'
          fi

      - name: Check out feature branch
        if: steps.state.outputs.state != 'MERGED'
        uses: actions/checkout@v6
        with:
          ref: feature/0.1.4-beta.1-routing-validation
          fetch-depth: 0

      - name: Wait for implementation helpers
        if: steps.state.outputs.state != 'MERGED'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          watched = {
              'Apply 0.1.4 beta.1 routing validation',
              'Patch 0.1.4 beta.1 viewport accessibility',
              'Update 0.1.4 beta.1 documentation',
              'Cleanup 0.1.4 beta.1 helper workflows',
              'Stabilize 0.1.4 beta.1 offline fixtures',
          }
          repository = os.environ['REPOSITORY']
          branch = urllib.parse.quote(os.environ['BRANCH'], safe='')
          token = os.environ['GH_TOKEN']
          url = (
              f'https://api.github.com/repos/{repository}/actions/runs'
              f'?branch={branch}&per_page=100'
          )
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          for _ in range(180):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  payload = json.load(response)
              latest = {}
              for run in payload.get('workflow_runs', []):
                  name = run.get('name')
                  if name in watched and name not in latest:
                      latest[name] = run
              active = [
                  run for run in latest.values()
                  if run.get('status') != 'completed'
              ]
              if not active:
                  break
              time.sleep(5)
          else:
              raise SystemExit('Timed out waiting for implementation helpers.')
          PY

      - name: Refresh branch and validate source
        if: steps.state.outputs.state != 'MERGED'
        shell: bash
        run: |
          git fetch origin "${BRANCH}"
          git reset --hard "origin/${BRANCH}"
          python3 -m py_compile \
            tool/audit_production_routes.py \
            tool/test_public_routes.py \
            tool/summarize_lighthouse.py \
            tool/offline_pwa.py \
            tool/test_offline_pwa.py \
            tool/validate_web_seo.py \
            tool/finalize_web_pwa.py
          node --check web/analytics.js
          node --check web/pwa_install.js
          node --check web/pwa_service_worker.js
          python3 tool/prepare_web_pwa.py --web-dir web
          python3 tool/validate_web_seo.py web
          python3 tool/test_public_routes.py web
          python3 tool/test_offline_pwa.py
          grep -q 'name="robots" content="noindex,follow"' web/404.html
          ! grep -q 'rel="canonical"' web/404.html
          ! grep -q 'user-scalable=no' web/index.html
          grep -q '"./404.html"' tool/offline_pwa.py
          git diff --check

      - name: Publish exact clean validation commit
        if: steps.state.outputs.state != 'MERGED'
        shell: bash
        run: |
          rm -f \
            .github/workflows/apply-beta1-routing.yml \
            .github/workflows/patch-beta1-accessibility.yml \
            .github/workflows/update-beta1-docs.yml \
            .github/workflows/cleanup-beta1-helpers.yml \
            .github/workflows/stabilize-beta1-offline-tests.yml \
            .github/workflows/finalize-beta1.yml \
            .github/workflows/finalize-beta1-v2.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          rm -f \
            web/apple-touch-icon.png \
            web/icons/Icon-192.png \
            web/icons/Icon-512.png \
            web/icons/Icon-maskable-192.png \
            web/icons/Icon-maskable-512.png \
            web/social/infusioncalc-preview.png

          python3 - <<'PY'
          from pathlib import Path

          path = Path('web/404.html')
          source = path.read_text(encoding='utf-8')
          marker = '<!-- 0.1.4-beta.1 final permanent-gate commit -->'
          if marker not in source:
              source = source.replace('</body>', f'  {marker}\n</body>', 1)
              path.write_text(source, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore: publish final 0.1.4-beta.1 gate commit'
          git push origin "HEAD:${BRANCH}"
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"

      - name: Wait for permanent PR gates
        if: steps.state.outputs.state != 'MERGED'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          required = {
              'Flutter CI',
              'Validate SEO source contract',
              'Validate public route contract',
          }
          repository = os.environ['REPOSITORY']
          sha = os.environ['FINAL_SHA']
          token = os.environ['GH_TOKEN']
          url = (
              f'https://api.github.com/repos/{repository}/actions/runs'
              f'?head_sha={urllib.parse.quote(sha)}&per_page=100'
          )
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          latest = {}
          for _ in range(300):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  payload = json.load(response)
              latest = {}
              for run in payload.get('workflow_runs', []):
                  name = run.get('name')
                  if name in required and name not in latest:
                      latest[name] = run
              if required.issubset(latest) and all(
                  run.get('status') == 'completed' for run in latest.values()
              ):
                  break
              time.sleep(5)
          else:
              raise SystemExit(
                  'Timed out waiting for permanent PR gates. '
                  f'Observed: {sorted(latest)}'
              )

          failures = {
              name: run.get('conclusion')
              for name, run in latest.items()
              if run.get('conclusion') != 'success'
          }
          if failures:
              raise SystemExit(f'Permanent PR gates failed: {failures}')
          PY

      - name: Ready and merge pull request
        if: steps.state.outputs.state != 'MERGED'
        shell: bash
        run: |
          gh pr ready "${PR_NUMBER}" --repo "${REPOSITORY}"
          gh pr merge "${PR_NUMBER}" \
            --repo "${REPOSITORY}" \
            --squash \
            --subject 'feat: harden routing and production SEO validation for 0.1.4-beta.1' \
            --body 'Add a real noindex 404 page, canonical route and slash validation, offline 404 preservation, automated deployed-route checks, Lighthouse evidence and the production search registration checklist.'
          MERGE_SHA="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.merge_commit_sha')"
          test -n "${MERGE_SHA}"
          echo "MERGE_SHA=${MERGE_SHA}" >> "${GITHUB_ENV}"

      - name: Wait for production deployment and route audit
        if: steps.state.outputs.state != 'MERGED'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          repository = os.environ['REPOSITORY']
          sha = os.environ['MERGE_SHA']
          token = os.environ['GH_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def runs_for_sha():
              url = (
                  f'https://api.github.com/repos/{repository}/actions/runs'
                  f'?head_sha={urllib.parse.quote(sha)}&per_page=100'
              )
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response).get('workflow_runs', [])

          deploy = None
          for _ in range(300):
              deploy = next(
                  (
                      run for run in runs_for_sha()
                      if run.get('name') == 'Deploy Flutter PWA to GitHub Pages'
                  ),
                  None,
              )
              if deploy and deploy.get('status') == 'completed':
                  break
              time.sleep(5)
          else:
              raise SystemExit('Timed out waiting for GitHub Pages deployment.')
          if deploy.get('conclusion') != 'success':
              raise SystemExit(
                  f"GitHub Pages failed: {deploy.get('html_url')} "
                  f"({deploy.get('conclusion')})"
              )

          # The permanent audit is triggered by workflow_run and may have a
          # different head SHA. Locate its newest completed main-branch run.
          audit_url = (
              f'https://api.github.com/repos/{repository}/actions/workflows/'
              'production-web-audit.yml/runs?branch=main&per_page=20'
          )
          audit = None
          for _ in range(300):
              request = urllib.request.Request(audit_url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  runs = json.load(response).get('workflow_runs', [])
              audit = next(
                  (
                      run for run in runs
                      if run.get('created_at', '') >= deploy.get('created_at', '')
                  ),
                  None,
              )
              if audit and audit.get('status') == 'completed':
                  break
              time.sleep(5)
          else:
              raise SystemExit('Timed out waiting for production web audit.')
          if audit.get('conclusion') != 'success':
              raise SystemExit(
                  f"Production web audit failed: {audit.get('html_url')} "
                  f"({audit.get('conclusion')})"
              )

          print(f"Deployment: {deploy.get('html_url')}")
          print(f"Production audit: {audit.get('html_url')}")
          PY
