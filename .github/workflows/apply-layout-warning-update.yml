name: Apply layout and warning update

on:
  push:
    branches:
      - fix/0.1.3-beta.2-layout-warning
    paths:
      - 'tool/.apply_layout_warning_update_trigger'

permissions:
  contents: write

concurrency:
  group: apply-layout-warning-update
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      FLUTTER_VERSION: 3.44.8
      FLUTTER_SHA256: 672089e001571a9fbb209a495c583580c0c6c73ef98999264ba07fa93ace332d

    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v6
        with:
          ref: fix/0.1.3-beta.2-layout-warning
          fetch-depth: 0

      - name: Apply source, tests and documentation updates
        run: python3 tool/apply_layout_warning_update.py

      - name: Cache Flutter SDK
        uses: actions/cache@v5
        with:
          path: ~/.cache/kalkulator-lekow/flutter-${{ env.FLUTTER_VERSION }}
          key: flutter-linux-${{ env.FLUTTER_VERSION }}-${{ env.FLUTTER_SHA256 }}

      - name: Install verified Flutter SDK
        run: |
          FLUTTER_BIN="$(./tool/install_flutter_linux.sh)"
          echo "${FLUTTER_BIN}" >> "${GITHUB_PATH}"

      - name: Format changed Dart files
        run: |
          dart format \
            lib/app.dart \
            lib/presentation/calculator/calculator_screen.dart \
            test/presentation/calculator_screen_test.dart

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            lib/app.dart \
            lib/presentation/calculator/calculator_screen.dart \
            test/presentation/calculator_screen_test.dart \
            pubspec.yaml \
            README.md \
            ROADMAP.md \
            CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No generated changes required."
            exit 0
          fi
          git commit -m "fix: refine header warning and footer layout"
          git push origin HEAD:fix/0.1.3-beta.2-layout-warning
