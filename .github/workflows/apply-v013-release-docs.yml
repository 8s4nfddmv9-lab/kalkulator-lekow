name: Apply stable v0.1.3 documentation

on:
  push:
    branches:
      - release/v0.1.3
    paths:
      - 'tool/.apply_v013_release_docs_trigger'

permissions:
  contents: write

concurrency:
  group: apply-v013-release-docs
  cancel-in-progress: true

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
        with:
          ref: release/v0.1.3
          fetch-depth: 0

      - name: Apply release documentation
        run: python3 tool/apply_v013_release_docs.py

      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- CHANGELOG.md README.md ROADMAP.md
          if git diff --cached --quiet; then
            echo "No documentation changes required."
            exit 0
          fi
          git commit -m "docs: publish stable v0.1.3 status"
          git push origin HEAD:release/v0.1.3
