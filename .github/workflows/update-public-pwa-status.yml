name: Update public PWA status documentation

on:
  push:
    branches:
      - docs/public-pwa-status
    paths:
      - 'tool/.update_public_pwa_status_trigger'

permissions:
  contents: write

concurrency:
  group: update-public-pwa-status
  cancel-in-progress: true

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out documentation branch
        uses: actions/checkout@v6
        with:
          ref: docs/public-pwa-status
          fetch-depth: 0

      - name: Update status documentation
        run: python3 tool/update_public_pwa_status.py

      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md ROADMAP.md CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No documentation changes required."
            exit 0
          fi
          git commit -m "docs: make public PWA the current distribution"
          git push origin HEAD:docs/public-pwa-status
