name: Apply PWA install prompt feature

on:
  push:
    branches:
      - feature/0.1.3-pwa-install-prompt
    paths:
      - 'tool/.apply_pwa_install_prompt_trigger'

permissions:
  contents: write

concurrency:
  group: apply-pwa-install-prompt
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      FLUTTER_VERSION: 3.44.8
      FLUTTER_SHA256: 672089e001571a9fbb209a495c583580c0c6c73ef98999264ba07fa93ace332d

    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v6
        with:
          ref: feature/0.1.3-pwa-install-prompt
          fetch-depth: 0

      - name: Apply integration and documentation updates
        run: python3 tool/apply_pwa_install_prompt.py

      - name: Cache Flutter SDK
        uses: actions/cache@v5
        with:
          path: ~/.cache/kalkulator-lekow/flutter-${{ env.FLUTTER_VERSION }}
          key: flutter-linux-${{ env.FLUTTER_VERSION }}-${{ env.FLUTTER_SHA256 }}

      - name: Install verified Flutter SDK
        run: |
          FLUTTER_BIN="$(./tool/install_flutter_linux.sh)"
          echo "${FLUTTER_BIN}" >> "${GITHUB_PATH}"

      - name: Format Dart sources and tests
        run: dart format lib test

      - name: Validate browser bridge syntax
        run: node --check web/pwa_install.js

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- lib test README.md ROADMAP.md CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No generated changes required."
            exit 0
          fi
          git commit -m "feat: integrate adaptive PWA installation prompt"
          git push origin HEAD:feature/0.1.3-pwa-install-prompt
