name: Apply Lighthouse baseline correction

on:
  push:
    branches:
      - feature/0.1.4-beta.1-routing-404-validation
    paths:
      - '.github/workflows/apply-lighthouse-baseline-fix.yml'

permissions:
  contents: write

concurrency:
  group: apply-lighthouse-baseline-fix
  cancel-in-progress: false

jobs:
  apply:
    name: Apply reviewed correction
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v6

      - name: Apply patch
        run: python3 apply_lighthouse_fix.py

      - name: Validate corrected sources
        run: |
          python3 -m py_compile tool/run_lighthouse_audit.py
          grep -q 'height: auto' web/site.css
          grep -q 'EXPECTED_FLUTTER_DEPRECATION' tool/run_lighthouse_audit.py

      - name: Commit correction
        run: |
          rm -f apply_lighthouse_fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- web/site.css tool/run_lighthouse_audit.py docs/SEO_PRODUCTION_CHECKLIST.md
          git add -u -- apply_lighthouse_fix.py
          git diff --cached --check
          git commit -m 'fix: preserve image ratio and guard Flutter Lighthouse baseline'
          git push origin "HEAD:${GITHUB_REF_NAME}"
