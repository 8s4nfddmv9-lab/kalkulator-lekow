name: Apply SEO dev.2 static pages

on:
  push:
    branches:
      - feature/0.1.4-dev.2-static-pages
    paths:
      - '.github/workflows/apply-seo-dev2.yml'

permissions:
  contents: write

concurrency:
  group: apply-seo-dev2-static-pages
  cancel-in-progress: false

jobs:
  apply:
    name: Apply static pages and integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@v6

      - name: Extract verified implementation payload
        shell: bash
        run: |
          cat \
            .dev2-parts/part00.b64 \
            .dev2-parts/part01.b64 \
            .dev2-parts/part02.b64 \
            .dev2-parts/part03.b64 \
            .dev2-parts/part04.b64 \
            .dev2-parts/part05.b64 \
            .dev2-parts/part06.b64 \
            .dev2-parts/part07.b64 \
            > /tmp/dev2files.tar.gz.b64
          base64 --decode /tmp/dev2files.tar.gz.b64 > /tmp/dev2files.tar.gz
          echo '340faf7178a838d67a4a0761c6555a04fe32a733f66c0430865528fa18b806dd  /tmp/dev2files.tar.gz' \
            | sha256sum --check --strict -
          tar -xzf /tmp/dev2files.tar.gz -C .
          python3 apply_patch.py
          rm -f apply_patch.py

      - name: Validate generated source contract
        shell: bash
        run: |
          python3 -m py_compile \
            tool/prepare_web_pwa.py \
            tool/validate_web_seo.py \
            tool/offline_pwa.py \
            tool/test_offline_pwa.py \
            tool/finalize_web_pwa.py
          node --check web/pwa_service_worker.js
          python3 tool/prepare_web_pwa.py --web-dir web
          python3 tool/validate_web_seo.py web
          python3 tool/test_offline_pwa.py

      - name: Commit implementation and remove staging files
        shell: bash
        run: |
          rm -rf .dev2-parts
          rm -f .github/workflows/apply-seo-dev2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: add static information pages for 0.1.4-dev.2'
          git push origin "HEAD:${GITHUB_REF_NAME}"
