name: Validate SEO source contract

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/seo-source-contract.yml'
      - 'web/**'
      - 'tool/prepare_web_pwa.py'
      - 'tool/validate_web_seo.py'
      - 'tool/finalize_web_pwa.py'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/seo-source-contract.yml'
      - 'web/**'
      - 'tool/prepare_web_pwa.py'
      - 'tool/validate_web_seo.py'
      - 'tool/finalize_web_pwa.py'

permissions:
  contents: read

concurrency:
  group: seo-source-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate indexable source assets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Compile-check SEO tooling
        run: |
          python3 -m py_compile \
            tool/prepare_web_pwa.py \
            tool/validate_web_seo.py \
            tool/finalize_web_pwa.py

      - name: Generate deterministic local assets
        run: python3 tool/prepare_web_pwa.py --web-dir web

      - name: Validate source SEO contract
        run: python3 tool/validate_web_seo.py web
