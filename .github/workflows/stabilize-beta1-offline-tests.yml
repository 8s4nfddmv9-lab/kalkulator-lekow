name: Stabilize 0.1.4 beta.1 offline fixtures

on:
  push:
    branches:
      - feature/0.1.4-beta.1-routing-validation
    paths:
      - '.github/workflows/stabilize-beta1-offline-tests.yml'

permissions:
  contents: write

jobs:
  stabilize:
    name: Preserve focused offline fixture tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v6

      - name: Keep 404 requirement at production finalization boundary
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tool/offline_pwa.py')
          source = path.read_text(encoding='utf-8')
          source = source.replace('        "./404.html",\n', '', 1)

          anchor = '    missing_critical = sorted(CRITICAL_OFFLINE_FILES - set(files))\n'
          addition = '''    if (build_dir / "404.html").is_file() and "./404.html" not in files:
              raise OfflinePwaError(
                  "The custom 404 page is missing from the offline bundle.",
              )

          '''
          if addition.strip() not in source:
              if anchor not in source:
                  raise SystemExit('Offline critical-file validation anchor was not found.')
              source = source.replace(anchor, addition + anchor, 1)
          path.write_text(source, encoding='utf-8')
          PY

      - name: Verify offline tooling
        run: |
          python3 -m py_compile tool/offline_pwa.py tool/test_offline_pwa.py
          python3 tool/test_offline_pwa.py
          git diff --check

      - name: Commit fixture-compatible validation and remove helper
        run: |
          rm -f .github/workflows/stabilize-beta1-offline-tests.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tool/offline_pwa.py
          git add -u -- .github/workflows/stabilize-beta1-offline-tests.yml
          git diff --cached --check
          git commit -m 'test: keep offline fixtures focused after adding 404'
          git push origin "HEAD:${GITHUB_REF_NAME}"
