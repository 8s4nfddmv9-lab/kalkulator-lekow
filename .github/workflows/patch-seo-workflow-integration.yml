name: Patch SEO workflow integration

on:
  push:
    branches:
      - feature/0.1.4-dev.1-seo-foundations
    paths:
      - '.github/workflows/patch-seo-workflow-integration.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v6

      - name: Add explicit SEO validator integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          compile_needle = (
              '            tool/prepare_web_fallback_fonts.py \\\n'
              '            tool/finalize_web_pwa.py'
          )
          compile_replacement = (
              '            tool/prepare_web_fallback_fonts.py \\\n'
              '            tool/validate_web_seo.py \\\n'
              '            tool/finalize_web_pwa.py'
          )

          for filename in ('.github/workflows/ci.yml', '.github/workflows/github-pages.yml'):
              path = Path(filename)
              source = path.read_text(encoding='utf-8')
              if source.count(compile_needle) != 1:
                  raise SystemExit(f'Unexpected compile-check block in {filename}.')
              path.write_text(source.replace(compile_needle, compile_replacement, 1), encoding='utf-8')

          pages_path = Path('.github/workflows/github-pages.yml')
          pages = pages_path.read_text(encoding='utf-8')
          path_needle = (
              "      - 'tool/finalize_web_pwa.py'\n"
              "      - 'tool/offline_pwa.py'"
          )
          path_replacement = (
              "      - 'tool/finalize_web_pwa.py'\n"
              "      - 'tool/validate_web_seo.py'\n"
              "      - 'tool/offline_pwa.py'"
          )
          if pages.count(path_needle) != 1:
              raise SystemExit('Unexpected GitHub Pages path-filter block.')
          pages_path.write_text(pages.replace(path_needle, path_replacement, 1), encoding='utf-8')
          PY

      - name: Commit integration and remove helper workflow
        shell: bash
        run: |
          rm -f .github/workflows/patch-seo-workflow-integration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/workflows/ci.yml .github/workflows/github-pages.yml
          git add -u -- .github/workflows/patch-seo-workflow-integration.yml
          git commit -m 'ci: integrate SEO validator explicitly'
          git push origin "HEAD:${GITHUB_REF_NAME}"
