name: Web PWA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/web-pwa.yml'
      - 'lib/**'
      - 'web/**'
      - 'deploy/web/**'
      - 'tool/install_flutter_linux.sh'
      - 'tool/prepare_web_pwa.py'
      - 'tool/finalize_web_pwa.py'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/web-pwa.yml'
      - 'lib/**'
      - 'web/**'
      - 'deploy/web/**'
      - 'tool/install_flutter_linux.sh'
      - 'tool/prepare_web_pwa.py'
      - 'tool/finalize_web_pwa.py'
      - 'pubspec.yaml'
      - 'pubspec.lock'

permissions:
  contents: read
  packages: write

concurrency:
  group: web-pwa-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.8
  FLUTTER_SHA256: 672089e001571a9fbb209a495c583580c0c6c73ef98999264ba07fa93ace332d
  IMAGE_NAME: ghcr.io/8s4nfddmv9-lab/kalkulator-lekow-web

jobs:
  build-web:
    name: Build installable Flutter PWA
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Cache Flutter SDK
        uses: actions/cache@v5
        with:
          path: ~/.cache/kalkulator-lekow/flutter-${{ env.FLUTTER_VERSION }}
          key: flutter-linux-${{ env.FLUTTER_VERSION }}-${{ env.FLUTTER_SHA256 }}

      - name: Install verified Flutter SDK
        run: |
          FLUTTER_BIN="$(./tool/install_flutter_linux.sh)"
          echo "${FLUTTER_BIN}" >> "${GITHUB_PATH}"

      - name: Generate deterministic PWA icons
        run: python3 tool/prepare_web_pwa.py --web-dir web

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Flutter web release
        run: flutter build web --release

      - name: Finalize and validate PWA output
        run: |
          python3 tool/finalize_web_pwa.py build/web "${GITHUB_SHA}"
          grep -q 'display.*standalone' build/web/manifest.json
          grep -q "kalkulator-lekow-${GITHUB_SHA}" build/web/pwa_service_worker.js

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: kalkulator-lekow-web-${{ github.run_number }}
          path: build/web
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

  container:
    name: Build Caddy PWA container
    needs: build-web
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: kalkulator-lekow-web-${{ github.run_number }}
          path: build/web

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Kalkulator leków PWA

      - name: Write deployment summary
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          cat >> "${GITHUB_STEP_SUMMARY}" <<'EOF'
          ## Web PWA published

          Image: `ghcr.io/8s4nfddmv9-lab/kalkulator-lekow-web:latest`

          On the mini-PC run:

          `docker compose -f deploy/web/compose.yaml pull`
          `docker compose -f deploy/web/compose.yaml up -d`
          `sudo tailscale serve --bg http://127.0.0.1:8080`
          EOF
