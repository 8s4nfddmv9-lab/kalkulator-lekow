name: 'Archived: mini-PC PWA container'

# Historical/manual deployment path. Production is deployed to GitHub Pages by
# .github/workflows/github-pages.yml and served at https://infusioncalc.eu/.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: archived-mini-pc-pwa-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.8
  FLUTTER_SHA256: 672089e001571a9fbb209a495c583580c0c6c73ef98999264ba07fa93ace332d
  IMAGE_NAME: ghcr.io/8s4nfddmv9-lab/kalkulator-lekow-web

jobs:
  build-web:
    name: Build archived self-contained Flutter PWA artifact
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Cache Flutter SDK
        uses: actions/cache@v5
        with:
          path: ~/.cache/kalkulator-lekow/flutter-${{ env.FLUTTER_VERSION }}
          key: flutter-linux-${{ env.FLUTTER_VERSION }}-${{ env.FLUTTER_SHA256 }}

      - name: Install verified Flutter SDK
        run: |
          FLUTTER_BIN="$(./tool/install_flutter_linux.sh)"
          echo "${FLUTTER_BIN}" >> "${GITHUB_PATH}"

      - name: Generate deterministic local PWA assets
        run: |
          python3 tool/prepare_web_pwa.py --web-dir web
          python3 tool/prepare_web_fallback_fonts.py --web-dir web

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build self-contained Flutter web release
        run: |
          flutter build web \
            --release \
            --base-href / \
            --no-web-resources-cdn

      - name: Finalize and validate PWA output
        run: |
          python3 tool/prepare_web_fallback_fonts.py \
            --web-dir build/web \
            --check-only
          python3 tool/finalize_web_pwa.py build/web "${GITHUB_SHA}"
          grep -q 'display.*standalone' build/web/manifest.json
          grep -q 'fontFallbackBaseUrl' build/web/flutter_bootstrap.js
          grep -q "infusioncalc-pwa-${GITHUB_SHA}" build/web/pwa_service_worker.js
          grep -q '"./canvaskit/' build/web/offline-manifest.json
          grep -q '"./fallback-fonts/roboto/v32/KFOmCnqEu92Fr1Me4GZLCzYlKw.woff2"' \
            build/web/offline-manifest.json

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: kalkulator-lekow-web-archived-${{ github.run_number }}
          path: build/web
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

  container:
    name: Build and publish archived Caddy container
    needs: build-web
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: kalkulator-lekow-web-archived-${{ github.run_number }}
          path: build/web

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:manual-latest
            ${{ env.IMAGE_NAME }}:manual-sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Archived InfusionCalc mini-PC PWA

      - name: Write archival notice
        run: |
          cat >> "${GITHUB_STEP_SUMMARY}" <<'EOF'
          ## Archived mini-PC deployment

          This workflow was started manually. The supported public deployment is GitHub Pages at https://infusioncalc.eu/.

          Manual image: `ghcr.io/8s4nfddmv9-lab/kalkulator-lekow-web:manual-latest`

          Historical mini-PC and Tailscale instructions remain in `docs/WEB_PWA_MINI_PC.md`.
          EOF
