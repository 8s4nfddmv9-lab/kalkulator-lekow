name: Apply Umami analytics integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/0.1.3-beta.3-umami-analytics
    paths:
      - 'tool/.apply_umami_analytics_trigger'

permissions:
  contents: write

concurrency:
  group: apply-umami-analytics
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      FLUTTER_VERSION: 3.44.8
      FLUTTER_SHA256: 672089e001571a9fbb209a495c583580c0c6c73ef98999264ba07fa93ace332d

    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v6
        with:
          ref: feature/0.1.3-beta.3-umami-analytics
          fetch-depth: 0

      - name: Prepare one-off updater
        run: python3 tool/prepare_umami_updater.py

      - name: Apply integration, tests and documentation updates
        run: python3 tool/apply_umami_analytics.py

      - name: Cache Flutter SDK
        uses: actions/cache@v5
        with:
          path: ~/.cache/kalkulator-lekow/flutter-${{ env.FLUTTER_VERSION }}
          key: flutter-linux-${{ env.FLUTTER_VERSION }}-${{ env.FLUTTER_SHA256 }}

      - name: Install verified Flutter SDK
        run: |
          FLUTTER_BIN="$(./tool/install_flutter_linux.sh)"
          echo "${FLUTTER_BIN}" >> "${GITHUB_PATH}"

      - name: Format Dart sources and tests
        run: dart format lib test

      - name: Validate scripts
        run: |
          python3 -m py_compile \
            tool/prepare_umami_updater.py \
            tool/apply_umami_analytics.py \
            tool/finalize_web_pwa.py
          node --check web/analytics.js
          node --check web/pwa_install.js

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            CHANGELOG.md \
            README.md \
            ROADMAP.md \
            docs/PRIVACY.md \
            docs/VISION.md \
            lib \
            pubspec.yaml \
            test \
            tool/finalize_web_pwa.py \
            web/index.html \
            web/pwa_service_worker.js
          if git diff --cached --quiet; then
            echo "No generated changes required."
            exit 0
          fi
          git commit -m "feat: integrate privacy-focused Umami analytics"
          git push origin HEAD:feature/0.1.3-beta.3-umami-analytics
