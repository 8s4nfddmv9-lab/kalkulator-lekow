  <script>
    (function configureInterfaceLanguage() {
      const copy = {
        pl: {
          documentTitle: 'InfusionCalc — kalkulator infuzji, stężenia, przepływu i dawki',
          description: 'Dwukierunkowy kalkulator stężenia, przepływu i dawki we wlewie, działający także offline. Bez zaleceń dawkowania.',
          heading: 'InfusionCalc — kalkulator infuzji, stężenia, przepływu i dawki',
          locale: 'pl_PL',
          bootStarting: 'Uruchamianie InfusionCalc…',
          bootFailureTitle: 'Nie udało się uruchomić InfusionCalc.',
          bootOnlineRecovery: 'Zamknij aplikację, otwórz ją ponownie przy aktywnym internecie i poczekaj na pełne uruchomienie.',
          bootOfflineRecovery: 'Ta instalacja nie ma kompletnej wersji offline. Połącz się z internetem, uruchom aplikację raz do końca, zamknij ją i spróbuj ponownie.',
          diagnosticCode: 'Kod',
          retry: 'Spróbuj ponownie',
        },
        en: {
          documentTitle: 'InfusionCalc — infusion, concentration, flow rate and dose calculator',
          description: 'Bidirectional infusion concentration, flow rate and dose calculator that also works offline. No dosing recommendations.',
          heading: 'InfusionCalc — infusion, concentration, flow rate and dose calculator',
          locale: 'en_US',
          bootStarting: 'Starting InfusionCalc…',
          bootFailureTitle: 'InfusionCalc could not be started.',
          bootOnlineRecovery: 'Close the app, open it again with an active internet connection, and wait for it to start completely.',
          bootOfflineRecovery: 'This installation does not have a complete offline version. Connect to the internet, start the app fully once, close it, and try again.',
          diagnosticCode: 'Code',
          retry: 'Try again',
        },
      };
      const preferenceKeys = [
        'infusioncalc.presentation.v1.language',
        'flutter.infusioncalc.presentation.v1.language',
      ];

      function storedLanguage() {
        let value = null;
        try {
          for (const preferenceKey of preferenceKeys) {
            value = window.localStorage.getItem(preferenceKey);
            if (value !== null) {
              try {
                value = JSON.parse(value);
              } catch (_) {
                // Older or alternative stores may expose the raw string.
              }
              break;
            }
          }
        } catch (_) {
          // Storage can be unavailable in hardened or private browser modes.
        }
        return value === 'en' ? 'en' : 'pl';
      }

      window.__infusionCalcLanguageCopy = copy;
      window.infusionCalcSetLanguage = function (requestedLanguage) {
        const language = requestedLanguage === 'en' ? 'en' : 'pl';
        const selected = copy[language];
        window.__infusionCalcLanguage = language;
        document.documentElement.lang = language;
        document.title = selected.documentTitle;

        const metadata = [
          ['meta[name="description"]', 'content', selected.description],
          ['meta[property="og:locale"]', 'content', selected.locale],
          ['meta[property="og:title"]', 'content', selected.documentTitle],
          ['meta[property="og:description"]', 'content', selected.description],
          ['meta[property="og:image:alt"]', 'content', selected.heading],
          ['meta[name="twitter:title"]', 'content', selected.documentTitle],
          ['meta[name="twitter:description"]', 'content', selected.description],
          ['meta[name="twitter:image:alt"]', 'content', selected.heading],
        ];
        for (const [selector, attribute, value] of metadata) {
          document.querySelector(selector)?.setAttribute(attribute, value);
        }

        const heading = document.querySelector('.seo-heading');
        if (heading) {
          heading.textContent = selected.heading;
        }
        const boot = document.getElementById('boot-status');
        if (boot && boot.dataset.failure !== 'true') {
          boot.textContent = selected.bootStarting;
        }
      };

      window.infusionCalcSetLanguage(storedLanguage());
      document.addEventListener('DOMContentLoaded', function () {
        window.infusionCalcSetLanguage(window.__infusionCalcLanguage);
      }, { once: true });
    })();

  <script>
    const bootStatus = document.getElementById('boot-status');
    let flutterFirstFrameRendered = false;
    let bootRuntimeFailure = false;

    function rememberBootFailure(error) {
      bootRuntimeFailure = true;
      window.__infusionCalcBootFailure = String(error || 'unknown');
    }

    window.addEventListener('error', function (event) {
      rememberBootFailure(event.error || event.message);
    });

    window.addEventListener('unhandledrejection', function (event) {
      rememberBootFailure(event.reason);
    });

    window.addEventListener('flutter-first-frame', function () {
      flutterFirstFrameRendered = true;
      bootStatus?.remove();
    });

    window.setTimeout(function () {
      if (flutterFirstFrameRendered || !bootStatus?.isConnected) {
        return;
      }

      const code = bootRuntimeFailure ? 'BOOT_RUNTIME_ERROR' : 'BOOT_TIMEOUT';
      const languageCopy = window.__infusionCalcLanguageCopy[
        window.__infusionCalcLanguage === 'en' ? 'en' : 'pl'
      ];
      document.documentElement.dataset.bootFailure = code;
      bootStatus.dataset.failure = 'true';
      bootStatus.textContent = '';

      const card = document.createElement('div');
      card.className = 'boot-status__card';

      const title = document.createElement('div');
      title.textContent = languageCopy.bootFailureTitle;
      card.appendChild(title);

      const detail = document.createElement('p');
      detail.className = 'boot-status__detail';
      detail.textContent = navigator.onLine
        ? languageCopy.bootOnlineRecovery
        : languageCopy.bootOfflineRecovery;
      card.appendChild(detail);

      const diagnosticCode = document.createElement('span');
      diagnosticCode.className = 'boot-status__code';
      diagnosticCode.textContent = `${languageCopy.diagnosticCode}: ${code}`;
      card.appendChild(diagnosticCode);

      const retry = document.createElement('button');
      retry.type = 'button';
      retry.className = 'boot-status__retry';
      retry.textContent = languageCopy.retry;
      retry.addEventListener('click', function () {
        window.location.reload();
      });
      card.appendChild(retry);

      bootStatus.appendChild(card);
    }, 20000);

    (function configureOfflinePwa() {
      if (!('serviceWorker' in navigator) || !('caches' in window)) {
        return;
      }

      const offlineManifestUrl = 'offline-manifest.json';
      const readinessTimeoutMs = 60000;
      const readinessPollMs = 500;
      let registration = null;

      function delay(milliseconds) {
        return new Promise(function (resolve) {
          window.setTimeout(resolve, milliseconds);
        });
      }

      function requestServiceWorkerUpdate() {
        if (!registration || !navigator.onLine) {
          return Promise.resolve();
        }
        return registration.update().catch(function (error) {
          console.warn('Nie udało się sprawdzić aktualizacji PWA.', error);
        });
      }

      async function readOfflineManifest() {
        const response = await fetch(offlineManifestUrl, {
          cache: navigator.onLine ? 'no-store' : 'default',
          credentials: 'same-origin',
        });
        if (!response.ok) {
          throw new Error('Manifest offline nie jest dostępny.');
        }

        const manifest = await response.json();
        if (!manifest ||
            typeof manifest.build_id !== 'string' ||
            typeof manifest.cache_name !== 'string' ||
            !Array.isArray(manifest.files) ||
            manifest.file_count !== manifest.files.length) {
          throw new Error('Manifest offline ma nieprawidłowy format.');
        }
        return manifest;
      }

      async function completeCachedManifest() {
        const manifest = await readOfflineManifest();
        if (!(await caches.has(manifest.cache_name))) {
          return null;
        }

        const cache = await caches.open(manifest.cache_name);
        const cachedResponses = await Promise.all(
          manifest.files.map(function (url) {
            return cache.match(url, {
              ignoreSearch: true,
              ignoreVary: true,
            });
          }),
        );
        if (cachedResponses.some(function (response) { return !response; })) {
          return null;
        }
        return manifest;
      }

      async function waitForCompleteOfflineBundle() {
        const deadline = Date.now() + readinessTimeoutMs;
        let lastError = null;

        while (Date.now() < deadline) {
          try {
            const manifest = await completeCachedManifest();
            if (manifest) {
              return manifest;
            }
          } catch (error) {
            lastError = error;
          }
          await delay(readinessPollMs);
        }

        throw lastError || new Error('Nie udało się przygotować pełnej paczki offline.');
      }

      function markOfflineReady(manifest) {
        document.documentElement.dataset.offlineReady = 'true';
        document.documentElement.dataset.offlineBuild = manifest.build_id;
        window.dispatchEvent(new CustomEvent('infusioncalc-offline-ready', {
          detail: {
            buildId: manifest.build_id,
            fileCount: manifest.file_count,
            scope: registration ? registration.scope : null,
          },
        }));
      }

      function prepareOfflinePwa() {
        return navigator.serviceWorker.register(
          'pwa_service_worker.js',
          { updateViaCache: 'none' },
        ).then(function (value) {
          registration = value;
          return requestServiceWorkerUpdate();
        }).then(function () {
          return waitForCompleteOfflineBundle();
        }).then(function (manifest) {
          markOfflineReady(manifest);
        }).catch(function (error) {
          console.warn('Pełny tryb offline nie jest jeszcze gotowy.', error);
        });
      }

      // Start immediately. An unavailable third-party analytics script must not
      // delay service-worker registration or the local offline cache.
      prepareOfflinePwa();

      window.addEventListener('online', function () {
        requestServiceWorkerUpdate().then(function () {
          return waitForCompleteOfflineBundle();
        }).then(function (manifest) {
          markOfflineReady(manifest);
        }).catch(function (error) {
          console.warn('Nie udało się odświeżyć paczki offline.', error);
        });
      });
    })();
  </script>
