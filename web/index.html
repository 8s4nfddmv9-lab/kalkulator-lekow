<!DOCTYPE html>
<html lang="pl">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="description" content="InfusionCalc — techniczny kalkulator podaży leków bez zaleceń dawkowania i interpretacji klinicznej.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0f766e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="InfusionCalc">
  <meta name="format-detection" content="telephone=no">

  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/Icon-192.png">
  <link rel="manifest" href="manifest.json">

  <title>InfusionCalc</title>

  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #f5f7f7;
    }

    body {
      overscroll-behavior-y: none;
    }

    .boot-status {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      font: 600 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #134e4a;
    }
  </style>
</head>
<body>
  <div id="boot-status" class="boot-status" role="status" aria-live="polite">
    Uruchamianie InfusionCalc…
  </div>

  <script src="analytics.js"></script>
  <script
    defer
    src="https://cloud.umami.is/script.js"
    data-website-id="a75601c3-4636-4210-b309-c54736e06843"
    data-domains="infusioncalc.eu"
    data-do-not-track="true"
    data-exclude-search="true"
    data-exclude-hash="true"></script>
  <script src="pwa_install.js"></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('boot-status')?.remove();
    });

    (function configureOfflinePwa() {
      if (!('serviceWorker' in navigator) || !('caches' in window)) {
        return;
      }

      const offlineManifestUrl = 'offline-manifest.json';
      const readinessTimeoutMs = 60000;
      const readinessPollMs = 500;
      let registration = null;

      function delay(milliseconds) {
        return new Promise(function (resolve) {
          window.setTimeout(resolve, milliseconds);
        });
      }

      function requestServiceWorkerUpdate() {
        if (!registration || !navigator.onLine) {
          return Promise.resolve();
        }
        return registration.update().catch(function (error) {
          console.warn('Nie udało się sprawdzić aktualizacji PWA.', error);
        });
      }

      async function readOfflineManifest() {
        const response = await fetch(offlineManifestUrl, {
          cache: navigator.onLine ? 'no-store' : 'default',
          credentials: 'same-origin',
        });
        if (!response.ok) {
          throw new Error('Manifest offline nie jest dostępny.');
        }

        const manifest = await response.json();
        if (!manifest ||
            typeof manifest.build_id !== 'string' ||
            typeof manifest.cache_name !== 'string' ||
            !Array.isArray(manifest.files) ||
            manifest.file_count !== manifest.files.length) {
          throw new Error('Manifest offline ma nieprawidłowy format.');
        }
        return manifest;
      }

      async function completeCachedManifest() {
        const manifest = await readOfflineManifest();
        if (!(await caches.has(manifest.cache_name))) {
          return null;
        }

        const cache = await caches.open(manifest.cache_name);
        const cachedResponses = await Promise.all(
          manifest.files.map(function (url) {
            return cache.match(url, { ignoreSearch: true });
          }),
        );
        if (cachedResponses.some(function (response) { return !response; })) {
          return null;
        }
        return manifest;
      }

      async function waitForCompleteOfflineBundle() {
        const deadline = Date.now() + readinessTimeoutMs;
        let lastError = null;

        while (Date.now() < deadline) {
          try {
            const manifest = await completeCachedManifest();
            if (manifest) {
              return manifest;
            }
          } catch (error) {
            lastError = error;
          }
          await delay(readinessPollMs);
        }

        throw lastError || new Error('Nie udało się przygotować pełnej paczki offline.');
      }

      function markOfflineReady(manifest) {
        document.documentElement.dataset.offlineReady = 'true';
        document.documentElement.dataset.offlineBuild = manifest.build_id;
        window.dispatchEvent(new CustomEvent('infusioncalc-offline-ready', {
          detail: {
            buildId: manifest.build_id,
            fileCount: manifest.file_count,
            scope: registration ? registration.scope : null,
          },
        }));
      }

      function prepareOfflinePwa() {
        return navigator.serviceWorker.register(
          'pwa_service_worker.js',
          { updateViaCache: 'none' },
        ).then(function (value) {
          registration = value;
          return requestServiceWorkerUpdate();
        }).then(function () {
          return waitForCompleteOfflineBundle();
        }).then(function (manifest) {
          markOfflineReady(manifest);
        }).catch(function (error) {
          console.warn('Pełny tryb offline nie jest jeszcze gotowy.', error);
        });
      }

      // Start immediately. An unavailable third-party analytics script must not
      // delay service-worker registration or the local offline cache.
      prepareOfflinePwa();

      window.addEventListener('online', function () {
        requestServiceWorkerUpdate().then(function () {
          return waitForCompleteOfflineBundle();
        }).then(function (manifest) {
          markOfflineReady(manifest);
        }).catch(function (error) {
          console.warn('Nie udało się odświeżyć paczki offline.', error);
        });
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
